ть</h3><p>Версия перевода и дата проверки</p><span class="chip">Проверка источника</span></div><div class="card"><h3>Связь с оригиналом</h3><p>Ссылка на мод и его автора</p><span class="chip">Обязательно</span></div><div class="card"><h3>Статус</h3><p>Актуален · Устарел · Требует проверки</p><span class="chip">Без догадок</span></div></div><div class="notice">Основной источник переводов: <a href="https://xn--e1agacrzcbcc.xn--p1ai/ru" target="_blank" rel="noopener">Русификаторы модов</a>. Каталог переводов будет наполняться по мере проверки страниц и версий.</div>`,compat:()=>`<div class="pagehead"><h1>Compatibility Center</h1><p>Проверки версии игры, зависимостей, конфликтов и структуры Mods.</p></div><div class="grid"><div class="card feature"><h3>Версия игры</h3><p>Сверяем патч с заявлениями автора.</p></div><div class="card feature"><h3>Dependencies</h3><p>Core libraries, обязательные модули.</p></div><div class="card feature"><h3>Conflicts</h3><p>Overrides, дублирующие функции, несовместимости.</p></div><div class="card feature"><h3>Mods folder</h3><p>Глубина, Script Mods, архивы, дубли.</p></div></div><section class="section"><h2>Статусы</h2><div class="grid"><div class="card"><span class="chip" style="color:var(--mint)">Compatible</span><p>После подтверждения свежего источника.</p></div><div class="card"><span class="chip">Needs review</span><p>Нет подтверждения версии или теста.</p></div><div class="card"><span class="chip">Known issue</span><p>Подтверждённая проблема.</p></div></div></section>`,realism:()=>`<div class="pagehead"><h1>Realism Hub</h1><p>Реализм — целостная система жизненных механик, а не случайная подборка.</p></div><div class="grid"><div class="card feature"><h3>Health & Care</h3><p>Болезни, медицина, профилактика, уход</p></div><div class="card feature"><h3>Pregnancy & Birth</h3><p>Планирование, беременность, роды, восстановление</p></div><div class="card feature"><h3>Relationships</h3><p>Знакомства, совместимость, кризисы, развод</p></div>< ><div class="grid"><div class="card"><h3>Mod Manager · Windows</h3><p>Сканирование папки Mods, дубли, вложенность, package/script, отчёт.</p><span class="chip">В разработке</span></div><div class="card"><h3>AI Translator</h3><p>Перевод строк с сохранением XML, переменных и форматирования.</p><span class="chip">В разработке</span></div><div class="card"><h3>Compatibility Checker</h3><p>Версии, зависимости, конфликты и диагностика.</p><span class="chip">В разработке</span></div><div class="card"><h3>Personal Library</h3><p>Избранное, коллекции, заметки и отслеживание обновлений.</p><span class="chip">Планируется</span></div></div>`,guides:()=>`<div class="pagehead"><h1>Guides & Help</h1><p>База знаний для установки, обновления и диагностики модов.</p></div><div class="grid"><div class="card"><h3>Установка модов</h3><p>Package, Script Mods, структура папок.</p></div><div class="card"><h3>После патча</h3><p>Проверка и безопасное обновление.</p></div><div class="card"><h3>Диагностика</h3><p>Дубликаты, зависимости, конфликты, тестирование группами.</p></div><div class="card"><h3>Realism сборка</h3><p>Связные игровые системы без конфликтов.</p></div><div class="card"><h3>CAS / CC</h3><p>Overrides, meshes, recolors, default/non-default.</p></div><div class="card"><h3>18+ раздел</h3><p>Отдельная возрастная зона и маркировка.</p></div></div>`};
function go(p){document.querySelectorAll("#nav button").forEach(b=>b.classList.toggle("active",b.dataset.p===p));document.getElementById("crumb").textContent="SIMS UNIVERSE / "+p.toUpperCase();document.getElementById("content").innerHTML=pages[p]();if(p==="mods")drawMods();if(p==="creators")drawAuthors();window.scrollTo(0,0)}
function drawMods(){let q=(document.getElementById("ms")?.value||"").toLowerCase(),cat=document.getElementById("mc")?.value||"";let list=mods.filter(m=>(!q||m.join(" ").toLowerCase().includes(q))&&(!cat||m[2]===cat));document.getElementById("modsgrid").innerHTML=list.map(m=>`<article class="card mod"><div class="art">${m[3]}</div><div class="body"><h3>${m[0]}</h3><div class="meta">${m[1]} · ${m[2]}</div><p>${m[4]}</p><span class="chip">Требует проверки</span><br><a href="${m[5]}" target="_blank" rel="noopener">Оригинальный источник ↗</a></div></article>`).join("")||"Ничего не найдено"}
function drawAuthors(){let q=(document.getElementById("as")?.value||"").toLowerCase();document.getElementById("authorsgrid").innerHTML=authors.filter(a=>a.join(" ").toLowerCase().includes(q)).map(a=>`<article class="card"><div class="creator"><div class="avatar">${a[0][0]}</div><div><b>${a[0]}</b><div class="meta">${a[1]}</div></div></div><p><a href="${a[2]}" target="_blank" rel="noopener">Страница автора ↗</a></p></article>`).join("")||"Нет совпадений"}
document.getElementById("nav").onclick=e=>{let b=e.target.closest("button[data-p]");if(b)go(b.dataset.p)};go("home");
