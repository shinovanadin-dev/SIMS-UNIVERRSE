онтента.</p></div><section class="section"><h2>CC Quick Finder</h2><p class="meta">Выбери категорию - Quick Finder покажет подходящие источники и чек-лист, на что смотреть при скачивании. Ссылки не означают проверку каждого файла.</p><div class="toolbar"><button class="btn alt" onclick="showCCFinder('skin')">Skin & Genetics</button><button class="btn alt" onclick="showCCFinder('hair')">Hair</button><button class="btn alt" onclick="showCCFinder('clothes')">Clothing</button><button class="btn alt" onclick="showCCFinder('shoes')">Shoes</button><button class="btn alt" onclick="showCCFinder('bb')">Build/Buy</button><button class="btn alt" onclick="showCCFinder('details')">Makeup & Details</button></div><div id="ccfinder" class="card"><h3>Выберите категорию</h3><p>Quick Finder переключает ссылки на источники и подсказки по фильтрам.</p></div></section><div class="grid"><div class="card feature" onclick="showCCFinder('skin')"><h3>Genetics & Skin</h3><p>Скины, глаза, пресеты, детали</p></div><div class="card feature" onclick="showCCFinder('hair')"><h3>Hair</h3><p>Женские, мужские, универсальные</p></div><div class="card feature" onclick="showCCFinder('clothes')"><h3>Clothing</h3><p>Cozy, casual, high fashion</p></div><div class="card feature" onclick="showCCFinder('shoes')"><h3>Shoes</h3><p>Обувь и авторские коллекции</p></div><div class="card feature" onclick="showCCFinder('bb')"><h3>Build & Buy</h3><p>Мебель, декор, интерьер</p></div><div class="card feature" onclick="showCCFinder('details')"><h3>Makeup & Details</h3><p>Макияж, украшения, детали</p></div></div><section class="section"><h2>CC Source Finder</h2><p class="meta">Ищи по названию источника или категории. Ссылки ведут к внешним каталогам и страницам авторов.</p><div class="toolbar"><input id="ccsearch" placeholder="Поиск: волосы, одежда, skin, обувь…" oninput="drawCCSources()"><select id="cccategory" onchange="drawCCSources()"><option value="">Все категории</option></select><button class="btn alt" onclick="clearCCSourceFilters()">Сброс</button></div><div class="meta" id="ccsourcecount"></div><div class="cards" id="ccsources"></div></section><section class="section"><h2>Featured Build/Buy Sets</h2><p class="meta">Небольшая подборка объектов, которые добавляют ощущение обжитого пространства. Ссылки ведут на страницы авторов/публикаций.</p><div class="grid"><article class="card"><div class="body"><h3>Cheap & Chipped — Syboulette</h3><div class="meta">37 предметов · Base Game · Build/Buy</div><p>Потёртая, винтажная и бюджетная мебель и строительные детали. Есть чистые и состаренные текстуры - отлично для квартир, ремонта, съёмного жилья и Rags to Riches.</p><span class="chip">Build/Buy · Grunge</span><p><a href="https://www.curseforge.com/sims4/build-buy/cheap-chipped" target="_blank" rel="noopener">Страница коллекции ↗</a></p><button class="btn alt" onclick="saveCCSet('Cheap & Chipped — Syboulette','Syboulette','37 предметов · Base Game · Build/Buy','Потёртая винтажная мебель и строительные детали.','https://www.curseforge.com/sims4/build-buy/cheap-chipped')">♡ Сохранить набор</button></div></article><article class="card"><div class="body"><h3>Naturalis Laundry — SIMcredible!</h3><div class="meta">Laundry room · 4 части коллекции</div><p>Серия для прачечной: функциональные стиральная машина, сушилка, верёвка и корзина требуют Laundry Day. Extras и Decor дополняют помещение; ironing station декоративная.</p><span class="chip">Build/Buy · Laundry</span><p><a href="https://www.thesimsresource.com/downloads/1741327/" target="_blank" rel="noopener">Washer Area ↗</a> · <a href="https://www.thesimsresource.com/downloads/1741336/" target="_blank" rel="noopener">Extras ↗</a> · <a href="https://www.thesimsresource.com/downloads/1741356/" target="_blank" rel="noopener">Decor ↗</a> · <a href="https://www.thesimsresource.com/downloads/1741347/" target="_blank" rel="noopener">Ironing Station ↗</a></p><button class="btn alt" onclick="saveCCSet('Naturalis Laundry — SIMcredible!','SIMcredible!','Laundry room · 4 части коллекции','Прачечная коллекция. Functional items требуют Laundry Day; ironing station декоративная.','https://www.thesimsresource.com/downloads/1741327/')">♡ Сохранить набор</button></div></article></div></section><section class="section"><h2>CC Download Checklist</h2><p class="meta">Отмечай пункты прямо во время скачивания. Прогресс сохраняется в браузере на этом устройстве.</p><div class="card" id="cccheck"><div class="meta" id="ccprogress">0 / 6 отмечено</div><div style="display:grid;gap:10px;margin:12px 0"><label><input type="checkbox" data-cccheck="source"> Открыла страницу оригинального автора или публикации</label><label><input type="checkbox" data-cccheck="description"> Прочитала описание и инструкции</label><label><input type="checkbox" data-cccheck="mesh"> Проверила, нужен ли mesh или отдельный файл</label><label><input type="checkbox" data-cccheck="packs"> Проверила требования к DLC / packs</label><label><input type="checkbox" data-cccheck="replacement"> Проверила, не является ли файл default replacement и не дублирует установленный</label><label><input type="checkbox" data-cccheck="file"> Распаковала архив и убедилась, что файл нужного типа</label></div><button class="btn alt" onclick="resetCCChecklist()">Сбросить checklist</button></div></section><section class="section"><h2>Как отбираем CC для каталога</h2><div class="grid"><div class="card"><h3>Тип файла</h3><p>Package, mesh, recolor, accessory или default replacement - отмечаем тип и отдельно проверяем, нужен ли mesh другого автора.</p></div><div class="card"><h3>CAS категория</h3><p>Возраст, пол, frame, категории одежды и фильтры CAS. Указываем ограничения, если они заявлены создателем.</p></div><div class="card"><h3>Default / Non-default</h3><p>Default replacement выделяем особо: два замещающих файла одного ресурса могут конфликтовать. Non-default обычно можно выбирать в CAS независимо.</p></div><div class="card"><h3>Источник и дата</h3><p>В карточке CC указываем исходную страницу автора, а не зеркальный перезалив; статус актуальности ставим только после проверки.</p></div></div></section><section class="section"><h2>Каталоги по категориям</h2><div class="grid"><div class="card"><h3>Скины</h3><p>Отдельные каталоги skin tones</p><a href="https://www.thesimsresource.com/downloads/browse/category/sims4-skintones/" target="_blank" rel="noopener">TSR ↗</a><br><a href="https://sims4mods.com/page/appear/skinton" target="_blank" rel="noopener">Sims4Mods ↗</a><br><a href="https://thesimscatalog.com/sims4/category/skintones/" target="_blank" rel="noopener">The Sims Catalog ↗</a></div><div class="card"><h3>Волосы</h3><p>Подборки и страницы загрузок</p><a href="https://ccthesims.com/category/the-sims-4/hairstyles/" target="_blank" rel="noopener">CC The Sims — Hairstyles ↗</a><br><a href="https://www.playground.ru/sims_4/file/hair_and_faces" target="_blank" rel="noopener">Playground — Hair & Faces ↗</a></div><div class="card"><h3>Одежда</h3><p>Каталоги пользовательской одежды</p><a href="https://sims-market.ru/cat/sims-4/odezhda/?page=2" target="_blank" rel="noopener">Sims-Market ↗</a><br><a href="https://good-mods.com/sims-4/odezhda/" target="_blank" rel="noopener">Good-Mods ↗</a><br><a href="https://sims4package.com/odezhda/" target="_blank" rel="noopener">Sims4Package ↗</a></div><div class="card"><h3>Главный каталог</h3><p>Общий поиск пользовательского контента</p><a href="https://ccthesims.com/" target="_blank" rel="noopener">CC The Sims ↗</a></div><div class="card"><h3>Обувь</h3><p>Отдельные каталоги обуви и обувных коллекций</p><a href="https://www.patreon.com/jiussims" target="_blank" rel="noopener">Jius ↗</a><br><a href="https://www.patreon.com/cw/madlen/home" target="_blank" rel="noopener">Madlen ↗</a><br><a href="https://dallasgirl79.tumblr.com/dg-shoes" target="_blank" rel="noopener">DallasGirl ↗</a></div><div class="card"><h3>Build & Buy / интерьер</h3><p>Мебель, декор, объекты, наборы комнат и функциональный CC</p><a href="https://www.thesimsresource.com/" target="_blank" rel="noopener">TSR ↗</a><br><a href="https://ccthesims.com/" target="_blank" rel="noopener">CC The Sims ↗</a><br><a href="https://thesimscatalog.com/sims4/" target="_blank" rel="noopener">The Sims Catalog ↗</a></div><div class="card"><h3>Макияж и аксессуары</h3><p>Поиск косметики, украшений, деталей лица и декоративных дополнений.</p><a href="https://www.thesimsresource.com/" target="_blank" rel="noopener">TSR — общий каталог ↗</a><br><a href="https://thesimscatalog.com/sims4/" target="_blank" rel="noopener">The Sims Catalog ↗</a></div><div class="card"><h3>Build / Buy и интерьер</h3><p>Мебель, декор, свет, функциональные предметы и наборы для оформления комнат.</p><a href="https://www.thesimsresource.com/" target="_blank" rel="noopener">TSR ↗</a><br><a href="https://ccthesims.com/" target="_blank" rel="noopener">CC The Sims ↗</a></div><div class="card"><h3>CC по типу контента</h3><p>Подборка для поиска по внешнему виду, а не только имени создателя: лица, волосы, одежда, обувь, интерьер.</p><a href="https://www.playground.ru/sims_4/file/hair_and_faces" target="_blank" rel="noopener">Playground — Hair & Faces ↗</a></div></div></section><section class="section"><h2>Исходные каталоги</h2><div class="grid"><div class="card"><b>The Sims Resource</b><p>Каталог CC</p><a href="https://www.thesimsresource.com/" target="_blank">Открыть ↗</a></div><div class="card"><b>CC The Sims</b><p>Подборки и авторы</p><a href="https://ccthesims.com/" target="_blank">Открыть ↗</a></div><div class="card"><b>The Sims Catalog</b><p>CC категории</p><a href="https://thesimscatalog.com/sims4/" target="_blank">Открыть ↗</a></div></div></section>`,translations:()=>`<div class="pagehead"><h1>Русификаторы и переводы</h1><p>Переводы модов Sims 4 с привязкой к оригиналу, автору, версии и статусу проверки.</p></div><div class="grid"><div class="card"><h3>Переводчик модов</h3><p>Онлайн-инструмент: загрузка package, перевод текста, заявлено 11 языков и общий кэш переводов.</p><a href="https://xn--e1agacrzcbcc.xn-p1ai/ru/translator" target="_blank" rel="noopener">Открыть переводчик ↗</a></div><div class="card"><h3>Перенос переводов</h3><p>Отдельный инструмент сайта для переноса переводов.</p><a href="https://xn--e1agacrzcbcc.xn-p1ai/ru/tools" target="_blank" rel="noopener">Посмотреть инструменты ↗</a></div><div class="card"><h3>Другие инструменты для Sims</h3><p>Главное меню, интро, шрифты, удаление и замена пламбоба, Mod Manager.</p><a href="https://xn--e1agacrzcbcc.xn-p1ai/ru/tools" target="_blank" rel="noopener">Список инструментов ↗</a></div></div><div class="pagehead"><h2>Как будем вести русификаторы</h2><p>Перевод — отдельный файл, он не заменяет оригинальный мод. Проверяем соответствие версий и установку рядом с модом.</p></div><div class="grid"><div class="card"><h3>Package-переводы</h3><p>Чаще всего кладутся рядом с оригинальным модом. Не переименовываем файлы-переводы, если автор задаёт специальный порядок загрузки.</p></div><div class="card"><h3>Script / JSON / XML</h3><p>Установка зависит от конкретного мода: папка Translations, соседняя папка или инструкция автора. Не публикуем универсальные правила там, где их нет.</p></div><div class="card"><h3>Сверка версий</h3><p>Если обновился оригинал, старый перевод автоматически помечаем «требует проверки», пока не подтверждена совместимость.</p></div></div><div class="card"><h3>Другой каталог русификаторов</h3><p>Есть подборка переводов для популярных модов, включая MCCC, WickedWhims, RPO, UI Cheats, Meaningful Stories, Better BuildBuy, Slice of Life, моды Adeepindigo, Road to Fame и другие.</p><a href="https://sims4package.com/rusifikatory/" target="_blank" rel="noopener">Открыть каталог русификаторов ↗</a></div><div class="card"><h3>Каталог переводов</h3><p>Добавляем русификаторы, сверяем их с версиями оригинальных модов и отмечаем обновления. Ссылки ведут на страницы авторов и источники, файлы без разрешения не перезаливаем.</p><a href="https://xn--e1agacrzcbcc.xn--p1ai/ru" target="_blank" rel="noopener">Открыть сайт с переводами ↗</a></div><div class="grid"><div class="card"><h3>Актуальность</h3><p>Версия перевода и дата проверки</p><span class="chip">Проверка источника</span></div><div class="card"><h3>Связь с оригиналом</h3><p>Ссылка на мод и его автора</p><span class="chip">Обязательно</span></div><div class="card"><h3>Статус</h3><p>Актуален · Устарел · Требует проверки</p><span class="chip">Без догадок</span></div></div><div class="notice">Основной источник переводов: <a href="https://xn--e1agacrzcbcc.xn--p1ai/ru" target="_blank" rel="noopener">Русификаторы модов</a>. Каталог переводов будет наполняться по мере проверки страниц и версий.</div>`,compat:()=>`<div class="pagehead"><h1>Compatibility Center</h1><p>Patch tracker, dependencies, conflict checks and Mods folder hygiene.</p></div><div class="notice"><b>Current EA patch:</b> 1.129.39.1030 (PC) / 1.129.39.1230 (Mac) · October 27, 2026. A game update can invalidate previously safe mod statuses; never treat an older check as current.</div><div class="grid"><div class="card feature"><h3>Version check</h3><p>Compare game version against the creator’s update notes and patch-day tracker.</p></div><div class="card feature"><h3>Dependencies</h3><p>Check required libraries and core modules before installing a mod.</p></div><div class="card feature"><h3>Conflicts</h3><p>Look for duplicate overrides, overlapping gameplay systems and outdated copies.</p></div><div class="card feature"><h3>Mods folder</h3><p>Review script depth, package duplicates, archives and old versions.</p></div></div><section class="section"><h2>Latest patch references</h2><div class="grid"><div class="card"><h3>EA official patch notes</h3><p>1.129.39.1030 / Mac 1.129.39.1230, October 27, 2026.</p><a href="https://www.ea.com/games/the-sims/the-sims-4/news/update-10-27-2026" target="_blank" rel="noopener">Read official update ↗</a></div><div class="card"><h3>Patch tracking</h3><p>Use this tracker to identify patch-day status resets and modder confirmations.</p><a href="https://app.ts4modhound.com/visitor/patch_day_list" target="_blank" rel="noopener">TS4 Mod Hound Patch Log ↗</a></div><div class="card"><h3>EA Mod update guide</h3><p>EA recommends checking outdated or conflicting mod files after game updates.</p><a href="https://www.ea.com/" target="_blank" rel="noopener">EA official site ↗</a></div></div></section><section class="section"><h2>Compatibility status meanings</h2><div class="grid"><div class="card"><span class="chip" style="color:var(--mint)">Verified for patch</span><p>Author/source explicitly confirms the current game version.</p></div><div class="card"><span class="chip">Needs review</span><p>No current patch confirmation or details are incomplete.</p></div><div class="card"><span class="chip">Known issue</span><p>Source documents a problem, conflict or broken feature.</p></div><div class="card"><span class="chip">Dependency missing</span><p>A required library or companion file is not installed.</p></div></div><div class="notice">Statuses are not automatically assigned from release dates. A mod is marked verified only when an accessible primary source supports that claim.</div></section><section class="section"><h2>Patch day checklist</h2><p class="meta">Отмечай этапы при подготовке игры после обновления.</p><div class="card"><div id="patchchecklist"><label style="display:block;margin:8px 0"><input type="checkbox" onchange="patchChecklist()"> Backup saves and Mods folder</label><label style="display:block;margin:8px 0"><input type="checkbox" onchange="patchChecklist()"> Check EA patch notes and current game version</label><label style="display:block;margin:8px 0"><input type="checkbox" onchange="patchChecklist()"> Remove duplicate/old versions of mods</label><label style="display:block;margin:8px 0"><input type="checkbox" onchange="patchChecklist()"> Update core libraries and script mods from creator sources</label><label style="display:block;margin:8px 0"><input type="checkbox" onchange="patchChecklist()"> Test with a clean batch of updated mods first</label><label style="display:block;margin:8px 0"><input type="checkbox" onchange="patchChecklist()"> Add CC and gameplay mods in groups; isolate issues if errors appear</label></div><p id="patchprogress" class="meta">0 / 6 steps completed</p><button class="btn alt" onclick="resetPatchChecklist()">Reset checklist</button></div></section>`realism:()=>`<div class="pagehead"><h1>Realism Hub</h1><p>Реализм — целостная система жизненных механик, а не случайная подборка.</p></div><div class="grid"><div class="card feature"><h3>Health & Care</h3><p>Болезни, медицина, профилактика, уход</p></div><div class="card feature"><h3>Pregnancy & Birth</h3><p>Планирование, беременность, роды, восстановление</p></div><div class="card feature"><h3>Relationships</h3><p>Знакомства, совместимость, кризисы, развод</p></div><div class="card feature"><h3>Psychology</h3><p>Эмоции, память, черты, нейроразнообразие</p></div><div class="card feature"><h3>Money & Work</h3><p>Бюджет, долги, карьера, бизнес</p></div><div class="card feature"><h3>Education</h3><p>Школа, университет, кружки</p></div><div class="card feature"><h3>Daily Life</h3><p>Питание, уборка, покупки, привычки</p></div><div class="card feature"><h3>Body & Fitness</h3><p>Форма, активность, образ жизни</p></div><div class="card feature"><h3>Death & Grief</h3><p>Утрата, память, семейные последствия</p></div><div class="card feature"><h3>Seasons</h3><p>Погода, сезонность, окружение</p></div><div class="card feature"><h3>Pets</h3><p>Поведение, здоровье, уход</p></div><div class="card feature"><h3>City & Transport</h3><p>Передвижение и городской быт</p></div></div><div class="pagehead"><h2>Стартовая подборка по направлениям</h2><p>Ссылки на страницы авторов. Все позиции отмечены как требующие проверки текущей версии и зависимостей перед рекомендацией.</p></div><div class="cards"><article class="card"><div class="body"><h3>Healthcare Redux</h3><div class="meta">Здоровье · медицина · заболевания</div><p>Болезни, здоровье, медицинские игровые события.</p><a href="https://www.patreon.com/adeepindigo" target="_blank" rel="noopener">Adeepindigo ↗</a><span class="chip">Проверить версию</span></div></article><article class="card"><div class="body"><h3>Divergent Sims</h3><div class="meta">Психология · нейроразнообразие</div><p>Механики нейроразнообразия и связанные системы.</p><a href="https://www.patreon.com/adeepindigo" target="_blank" rel="noopener">Adeepindigo ↗</a><span class="chip">Проверить требования</span></div></article><article class="card"><div class="body"><h3>Relationship & Pregnancy Overhaul</h3><div class="meta">Отношения · беременность · семья</div><p>Модульные системы семейных решений, отношений и беременности.</p><a href="https://www.patreon.com/lumpinou" target="_blank" rel="noopener">Lumpinou ↗</a><span class="chip">Модули сверить</span></div></article><article class="card"><div class="body"><h3>Meaningful Stories</h3><div class="meta">Эмоции · настроение</div><p>Более последовательная эмоциональная система и настроение.</p><a href="https://roburky.itch.io/meaningful-stories" target="_blank" rel="noopener">roBurky ↗</a><span class="chip">Проверить совместимость</span></div></article><article class="card"><div class="body"><h3>MC Command Center</h3><div class="meta">Автономия · управление городом</div><p>Настройки населения, автономии, семей и игровых процессов.</p><a href="https://deaderpool-mccc.com/" target="_blank" rel="noopener">Deaderpool ↗</a><span class="chip">Core mod</span></div></article><article class="card"><div class="body"><h3>Basemental</h3><div class="meta">18+ · взрослый геймплей</div><p>Отдельная возрастная категория, проверяем зависимости и требования.</p><a href="https://basementalmods.com/" target="_blank" rel="noopener">Официальный сайт ↗</a><span class="chip">18+ · Проверка</span></div></article></div><div class="notice">Статусы здесь не означают, что проверка совместимости уже проведена. Сначала сверяем релиз и документацию автора, затем отмечаем карточку как проверенную.<br>Стартовые внешние подборки для дальнейшей проверки: <a href="https://boosty.to/ceyach/posts/9f9f5647-6be9-479c-afa6-66f5f5cb22d7" target="_blank" rel="noopener">Ceyach — realism ↗</a> · <a href="https://boosty.to/kkk365/posts/33ae3e22-3d1d-4789-8917-d07131cde312" target="_blank" rel="noopener">KKK365 ↗</a> · <a href="https://boosty.to/sabrisims/posts/6ca183f8-1903-4c15-94b3-370fe695ad1d" target="_blank" rel="noopener">SabriSims ↗</a></div>`,collections:()=>`<div class="pagehead"><h1>Collections & Navigators</h1><p>Сценарии сборки с понятной очередностью, без случайного скачивания десятков модов.</p></div><div class="notice">Это curated starting points: список не означает, что все версии модов проверены на текущем патче. Открывай карточки и сверяй requirements у автора.</div><div class="grid"><div class="card"><h3>Realistic Life</h3><p>Собирай жизненные системы поэтапно: здоровье → психология → отношения и семья → работа/образование → повседневность.</p><p class="meta">Порядок: core dependencies → healthcare → emotional systems → relationships → lifestyle. Не ставь сразу несколько модов, меняющих одну механику.</p><button class="btn alt" onclick="openModSearch('Realism')">Найти realism-моды</button></div><div class="card"><h3>CAS Essentials</h3><p>Базовый CAS: skin details, глаза, брови, пресеты, макияж. Сначала non-default контент, потом осторожно выбирай default replacements.</p><p class="meta">Правило: не устанавливай несколько replacements для одного ресурса.</p><button class="btn alt" onclick="go('cc');showCCFinder('skin')">Открыть Skin & Genetics</button></div><div class="card"><h3>Wardrobe</h3><p>Капсула: повседневная, сезонная, обувь, formal, спорт. Выбирай по стилю и фильтруй дубли, meshes и body compatibility.</p><p class="meta">Направления авторов: Greenllamas · Trillyke · Sentate.</p><button class="btn alt" onclick="go('cc');showCCFinder('clothes')">Открыть Clothing</button></div><div class="card"><h3>Cozy Home</h3><p>Мебель, свет, декор, clutter и тематические наборы. Скачивай коллекциями, сохраняя список сетов и их meshes.</p><p class="meta">Проверяй: mesh, функциональность, required packs, количество файлов.</p><button class="btn alt" onclick="go('cc');showCCFinder('bb')">Открыть Build/Buy</button></div><div class="card"><h3>Core Mods</h3><p>Инструменты, библиотеки и UI. Core и dependency-моды ставятся до зависимых модов; не держи две версии одной библиотеки.</p><p class="meta">MC Command Center · Lot 51 Core · XML Injector — проверяй требования у каждого мода отдельно.</p><button class="btn alt" onclick="openModSearch('Dependency')">Найти библиотеки</button></div><div class="card"><h3>Patch Day Rescue</h3><p>Backup → проверить версию → убрать старые копии → обновить core и script mods → тестировать небольшими группами → вернуть основной сейв.</p><button class="btn alt" onclick="go('compat')">Открыть Compatibility Center</button></div></div><section class="section"><h2>Сборка без хаоса: порядок установки</h2><div class="card"><ol><li>Создай резервную копию папок Saves и Mods.</li><li>Установи библиотеки и необходимые dependencies.</li><li>Добавляй gameplay/script mods одной тематической группой.</li><li>Запусти игру и проверь эту группу.</li><li>Добавляй CC отдельными категориями (CAS, обувь, Build/Buy).</li><li>После проверки зафиксируй название, автора, дату и источник - так проще искать конфликт.</li></ol></div></section>`tools:()=>`<div class="pagehead"><h1>Tools</h1><p>Инструменты, запланированные для Sims Universe.</p></div><div class="pagehead"><h2>Исследовательские списки и базы</h2><p>Внешние таблицы и подборки используем как ориентир для поиска, но не считаем их подтверждением совместимости без сверки с автором мода.</p></div><div class="grid"><div class="card"><h3>Списки Core Mods / Default</h3><p>Базовые моды, default-контент, категории и пометки о требованиях. Проверяем, что записи не устарели.</p><a href="https://docs.google.com/spreadsheets/d/1PmWop94HcciQ6-wnAGRuwWG6jmkn_Mc809KKYmkAp0E/edit?gid=613099857#gid=613099857" target="_blank" rel="noopener">Открыть список ↗</a></div><div class="card"><h3>Core / Default / Notes</h3><p>Второй лист с дополнительными списками и замечаниями по установке.</p><a href="https://docs.google.com/spreadsheets/d/1PmWop94HcciQ6-wnAGRuwWG6jmkn_Mc809KKYmkAp0E/edit?gid=0" target="_blank" rel="noopener">Открыть лист ↗</a></div><div class="card"><h3>Категории и сборки</h3><p>Дополнительный список: категории, мини-коллекции, замены, требования к библиотекам и предупреждения.</p><a href="https://docs.google.com/spreadsheets/d/1kJ62G8_15lDUnQM6TN4JTFlAVmnDA5oQbQclhQzCiDM/edit?gid=546143462#gid=546143462&fvid=585847056" target="_blank" rel="noopener">Открыть таблицу ↗</a></div><div class="card"><h3>Справочник и заметки</h3><p>Дополнительный документ, используемый как источник для систематизации модов.</p><a href="https://docs.google.com/document/d/1UHSnGQ5j92D4rNDpy_sBRPXnqlWnxIv5/edit?pli=1" target="_blank" rel="noopener">Открыть документ ↗</a></div><div class="card"><h3>Сообщество и подборки VK</h3><p>Посты, подборки и сообщества - отдельный источник для поиска, со сверкой ссылок и авторства.</p><a href="https://vk.ru/club215685142?act=s&id=215685142#section=wall" target="_blank" rel="noopener">Подборка ↗</a><br><a href="https://vk.ru/missishope" target="_blank" rel="noopener">Missishope ↗</a><br><a href="https://vk.ru/thesimshotdate" target="_blank" rel="noopener">The Sims Hot Date ↗</a><br><a href="https://vk.ru/origamika_sims4" target="_blank" rel="noopener">Origamika ↗</a></div></div><div class="grid"><div class="card"><h3>Mod Manager · Windows</h3><p>Сканирование папки Mods, дубли, вложенность, package/script, отчёт.</p><span class="chip">В разработке</span></div><div class="card"><h3>AI Translator</h3><p>Перевод строк с сохранением XML, переменных и форматирования.</p><span class="chip">В разработке</span></div><div class="card"><h3>Compatibility Checker</h3><p>Версии, зависимости, конфликты и диагностика.</p><span class="chip">В разработке</span></div><div class="card"><h3>Personal Library</h3><p>Избранное, коллекции, заметки и отслеживание обновлений.</p><span class="chip">Планируется</span></div></div>`,guides:()=>`<div class="pagehead"><h1>Guides & Help</h1><p>Практические инструкции по безопасной установке и обслуживанию модов.</p></div><div class="grid"><div class="card"><h3>Правильная структура Mods</h3><p>CC package-файлы можно размещать в папках; script-моды обычно не глубже одного уровня от Mods. Не распаковывайте архивы внутрь игры без проверки инструкции автора.</p></div><div class="card"><h3>После обновления игры</h3><p>Перед запуском: резервная копия Saves, временно убрать Mods, проверить актуальность крупных модов и библиотек, вернуть моды группами и проверить игру.</p></div><div class="card"><h3>Как искать конфликт</h3><p>Отключить весь CC, проверить игру, затем возвращать половинами или по категориям. Не обновлять сразу десятки модов, если нужно найти источник ошибки.</p></div><div class="card"><h3>Overrides и Defaults</h3><p>Default replacements меняют базовый ресурс игры и обычно могут конфликтовать друг с другом. Проверяйте, не установлены ли два файла, заменяющих одну и ту же область.</p></div><div class="card"><h3>Core Libraries</h3><p>Некоторые моды требуют отдельную библиотеку или общий ресурс. Проверяйте требования на странице конкретного мода и не удаляйте библиотеку, пока не выясните, какие моды её используют.</p></div><div class="card"><h3>Сохранения и тестирование</h3><p>Для диагностики тестируйте на копии сохранения. Если мод добавляет игровые объекты, отношения или системные данные, удаление может повлиять на сохранение.</p></div><div class="grid"><div class="card"><h3>Установка модов</h3><p>Package, Script Mods, структура папок.</p></div><div class="card"><h3>Диагностика</h3><p>Дубликаты, зависимости, конфликты, тестирование группами.</p></div><div class="card"><h3>Realism сборка</h3><p>Связные игровые системы без конфликтов.</p></div><div class="card"><h3>CAS / CC</h3><p>Overrides, meshes, recolors, default/non-default.</p></div><div class="card"><h3>18+ раздел</h3><p>Отдельная возрастная зона и маркировка.</p></div></div>`<p>База знаний для установки, обновления и диагностики модов.</p></div><div class="grid"><div class="card"><h3>Установка модов</h3><p>Package, Script Mods, структура папок.</p></div><div class="card"><h3>После патча</h3><p>Проверка и безопасное обновление.</p></div><div class="card"><h3>Диагностика</h3><p>Дубликаты, зависимости, конфликты, тестирование группами.</p></div><div class="card"><h3>Realism сборка</h3><p>Связные игровые системы без конфликтов.</p></div><div class="card"><h3>CAS / CC</h3><p>Overrides, meshes, recolors, default/non-default.</p></div><div class="card"><h3>18+ раздел</h3><p>Отдельная возрастная зона и маркировка.</p></div></div>`};
const LIB_KEY="simsuniverse_personal_library_v1";function getLibrary(){try{return JSON.parse(localStorage.getItem(LIB_KEY)||"[]")}catch(e){return []}}function saveLibEntry(entry){let lib=getLibrary(),key=entry.type+"|"+entry.title+"|"+entry.creator;if(lib.some(x=>x.key===key)){alert("Уже сохранено в Personal Library");return}entry.key=key;lib.unshift(entry);localStorage.setItem(LIB_KEY,JSON.stringify(lib));alert("Сохранено в Personal Library")}function saveModByName(title,creator){let m=mods.find(x=>x[0]===title&&x[1]===creator);if(m)saveLibEntry({type:"mod",title:m[0],creator:m[1],category:m[2],description:m[4],url:m[5]})}function saveCreatorByName(title){let a=authors.find(x=>x[0]===title);if(a)saveLibEntry({type:"creator",title:a[0],creator:a[1],category:"",description:"",url:a[2]})}function saveCCSet(title,creator,category,description,url){saveLibEntry({type:"cc",title,creator,category,description,url,collection:"Build/Buy"})}const LIB_COLLECTION_KEY="simsuniverse_library_collections_v1";const LIB_DEFAULTS=["CAS","Build/Buy","Realism","Gameplay","Установить позже"

function populateModCategories(){const select=document.getElementById('mc');if(!select)return;const categories=[...new Set(mods.map(m=>m[2]))].sort((a,b)=>a.localeCompare(b));const uniqueCount=mods.filter((m,i)=>mods.findIndex(x=>x[0]===m[0]&&x[1]===m[1])===i).length;select.innerHTML='<option value="">Все категории ('+uniqueCount+' модов)</option>'+categories.map(c=>'<option>'+c+'</option>').join('');}
function clearModFilters(){let a=document.getElementById("ms"),b=document.getElementById("mc");if(a)a.value="";if(b)b.value="";drawMods()}function drawMods(){let q=(document.getElementById("ms")?.value||"").toLowerCase(),cat=document.getElementById("mc")?.value||"";let unique=mods.filter((m,i)=>mods.findIndex(x=>x[0]===m[0]&&x[1]===m[1])===i);let list=unique.filter(m=>(!q||m.join(" ").toLowerCase().includes(q))&&(!cat||m[2]===cat));let count=document.getElementById("modcount");if(count)count.textContent="Найдено: "+list.length+" из "+unique.length+" уникальных модов"+(cat?" · "+cat:"")+(q?" · поиск: "+q:"");document.getElementById("modsgrid").innerHTML=list.map(m=>`<article class="card mod"><div class="art">${m[3]}</div><div class="body"><h3>${m[0]}</h3><div class="meta">${m[1]} · ${m[2]}</div><p>${m[4]}</p><span class="chip">Требует проверки</span><br><a href="${m[5]}" target="_blank" rel="noopener">Оригинальный источник ↗</a><p><button class="btn alt" onclick="saveModByName(${JSON.stringify(m[0])},${JSON.stringify(m[1])})">♡ В библиотеку</button></p></div></article>`).join("")||"Ничего не найдено"}
function populateAuthorCategories(){const s=document.getElementById("ac");if(!s)return;const tags=[...new Set(authors.flatMap(a=>a[1].split("·").map(x=>x.trim()).filter(Boolean)))].sort((a,b)=>a.localeCompare(b));s.innerHTML='<option value="">Все направления ('+authors.length+' авторов)</option>'+tags.map(t=>'<option>'+t+'</option>').join("")}
function clearAuthorFilters(){const q=document.getElementById("as"),c=document.getElementById("ac");if(q)q.value="";if(c)c.value="";drawAuthors()}
function drawAuthors(){let q=(document.getElementById("as")?.value||"").toLowerCase(),cat=document.getElementById("ac")?.value||"";let list=authors.filter(a=>(!q||a.join(" ").toLowerCase().includes(q))&&(!cat||a[1].split("·").map(x=>x.trim()).includes(cat)));const count=document.getElementById("authorcount");if(count)count.textContent="Найдено: "+list.length+" из "+authors.length+" авторов"+(cat?" · "+cat:"")+(q?" · поиск: "+q:"");document.getElementById("authorsgrid").innerHTML=list.map(a=>`<article class="card"><div class="creator"><div class="avatar">${a[0][0]}</div><div><b>${a[0]}</b><div class="meta">${a[1]}</div></div></div><p><a href="${a[2]}" target="_blank" rel="noopener">Страница автора ↗</a></p><button class="btn alt" onclick="saveCreatorByName(${JSON.stringify(a[0])})">♡ В библиотеку</button></article>`).join("")||"Нет совпадений"}
document.getElementById("nav").onclick=e=>{let b=e.target.closest("button[data-p]");if(b)go(b.dataset.p)};go("home");
