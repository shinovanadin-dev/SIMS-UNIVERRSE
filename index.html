онтента.</p></div><section class="section"><h2>CC Quick Finder</h2><p class="meta">Выбери категорию - Quick Finder покажет подходящие источники и чек-лист, на что смотреть при скачивании. Ссылки не означают проверку каждого файла.</p><div class="toolbar"><button class="btn alt" onclick="showCCFinder('skin')">Skin & Genetics</button><button class="btn alt" onclick="showCCFinder('hair')">Hair</button><button class="btn alt" onclick="showCCFinder('clothes')">Clothing</button><button class="btn alt" onclick="showCCFinder('shoes')">Shoes</button><button class="btn alt" onclick="showCCFinder('bb')">Build/Buy</button><button class="btn alt" onclick="showCCFinder('details')">Makeup & Details</button></div><div id="ccfinder" class="card"><h3>Выберите категорию</h3><p>Quick Finder переключает ссылки на источники и подсказки по фильтрам.</p></div></section><div class="grid"><div class="card feature" onclick="showCCFinder('skin')"><h3>Genetics & Skin</h3><p>Скины, глаза, пресеты, детали</p></div><div class="card feature" onclick="showCCFinder('hair')"><h3>Hair</h3><p>Женские, мужские, универсальные</p></div><div class="card feature" onclick="showCCFinder('clothes')"><h3>Clothing</h3><p>Cozy, casual, high fashion</p></div><div class="card feature" onclick="showCCFinder('shoes')"><h3>Shoes</h3><p>Обувь и авторские коллекции</p></div><div class="card feature" onclick="showCCFinder('bb')"><h3>Build & Buy</h3><p>Мебель, декор, интерьер</p></div><div class="card feature" onclick="showCCFinder('details')"><h3>Makeup & Details</h3><p>Макияж, украшения, детали</p></div></div><section class="section"><h2>CC Source Finder</h2><p class="meta">Ищи по названию источника или категории. Ссылки ведут к внешним каталогам и страницам авторов.</p><div class="toolbar"><input id="ccsearch" placeholder="Поиск: волосы, одежда, skin, обувь…" oninput="drawCCSources()"><select id="cccategory" onchange="drawCCSources()"><option value="">Все категории</option></select><button class="btn alt" onclick="clearCCSourceFilters()">Сброс</button></div><div class="meta" id="ccsourcecount"></div><div class="cards" id="ccsources"></div></section><section class="section"><h2>Featured Build/Buy Sets</h2><p class="meta">Небольшая подборка объектов, которые добавляют ощущение обжитого пространства. Ссылки ведут на страницы авторов/публикаций.</p><div class="grid"><article class="card"><div class="body"><h3>Cheap & Chipped — Syboulette</h3><div class="meta">37 предметов · Base Game · Build/Buy</div><p>Потёртая, винтажная и бюджетная мебель и строительные детали. Есть чистые и состаренные текстуры - отлично для квартир, ремонта, съёмного жилья и Rags to Riches.</p><span class="chip">Build/Buy · Grunge</span><p><a href="https://www.curseforge.com/sims4/build-buy/cheap-chipped" target="_blank" rel="noopener">Страница коллекции ↗</a></p><button class="btn alt" onclick="saveCCSet('Cheap & Chipped — Syboulette','Syboulette','37 предметов · Base Game · Build/Buy','Потёртая винтажная мебель и строительные детали.','https://www.curseforge.com/sims4/build-buy/cheap-chipped')">♡ Сохранить набор</button></div></article><article class="card"><div class="body"><h3>Naturalis Laundry — SIMcredible!</h3><div class="meta">Laundry room · 4 части коллекции</div><p>Серия для прачечной: функциональные стиральная машина, сушилка, верёвка и корзина требуют Laundry Day. Extras и Decor дополняют помещение; ironing station декоративная.</p><span class="chip">Build/Buy · Laundry</span><p><a href="https://www.thesimsresource.com/downloads/1741327/" target="_blank" rel="noopener">Washer Area ↗</a> · <a href="https://www.thesimsresource.com/downloads/1741336/" target="_blank" rel="noopener">Extras ↗</a> · <a href="https://www.thesimsresource.com/downloads/1741356/" target="_blank" rel="noopener">Decor ↗</a> · <a href="https://www.thesimsresource.com/downloads/1741347/" target="_blank" rel="noopener">Ironing Station ↗</a></p><button class="btn alt" onclick="saveCCSet('Naturalis Laundry — SIMcredible!','SIMcredible!','Laundry room · 4 части коллекции','Прачечная коллекция. Functional items требуют Laundry Day; ironing station декоративная.','https://www.thesimsresource.com/downloads/1741327/')">♡ Сохранить набор</button></div></article></div></section><section class="section"><h2>CC Download Checklist</h2><p class="meta">Отмечай пункты прямо во время скачивания. Прогресс сохраняется в браузере на этом устройстве.</p><div class="card" id="cccheck"><div class="meta" id="ccprogress">0 / 6 отмечено</div><div style="display:grid;gap:10px;margin:12px 0"><label><input type="checkbox" data-cccheck="source"> Открыла страницу оригинального автора или публикации</label><label><input type="checkbox" data-cccheck="description"> Прочитала описание и инструкции</label><label><input type="checkbox" data-cccheck="mesh"> Проверила, нужен ли mesh или отдельный файл</label><label><input type="checkbox" data-cccheck="packs"> Проверила требования к DLC / packs</label><label><input type="checkbox" data-cccheck="replacement"> Проверила, не является ли файл default replacement и не дублирует установленный</label><label><input type="checkbox" data-cccheck="file"> Распаковала архив и убедилась, что файл нужного типа</label></div><button class="btn alt" onclick="resetCCChecklist()">Сбросить checklist</button></div></section><section class="section"><h2>Как отбираем CC для каталога</h2><div class="grid"><div class="card"><h3>Тип файла</h3><p>Package, mesh, recolor, accessory или default replacement - отмечаем тип и отдельно проверяем, нужен ли mesh другого автора.</p></div><div class="card"><h3>CAS категория</h3><p>Возраст, пол, frame, категории одежды и фильтры CAS. Указываем ограничения, если они заявлены создателем.</p></div><div class="card"><h3>Default / Non-default</h3><p>Default replacement выделяем особо: два замещающих файла одного ресурса могут конфликтовать. Non-default обычно можно выбирать в CAS независимо.</p></div><div class="card"><h3>Источник и дата</h3><p>В карточке CC указываем исходную страницу автора, а не зеркальный перезалив; статус актуальности ставим только после проверки.</p></div></div></section><section class="section"><h2>Каталоги по категориям</h2><div class="grid"><div class="card"><h3>Скины</h3><p>Отдельные каталоги skin tones</p><a href="https://www.thesimsresource.com/downloads/browse/category/sims4-skintones/" target="_blank" rel="noopener">TSR ↗</a><br><a href="https://sims4mods.com/page/appear/skinton" target="_blank" rel="noopener">Sims4Mods ↗</a><br><a href="https://thesimscatalog.com/sims4/category/skintones/" target="_blank" rel="noopener">The Sims Catalog ↗</a></div><div class="card"><h3>Волосы</h3><p>Подборки и страницы загрузок</p><a href="https://ccthesims.com/category/the-sims-4/hairstyles/" target="_blank" rel="noopener">CC The Sims — Hairstyles ↗</a><br><a href="https://www.playground.ru/sims_4/file/hair_and_faces" target="_blank" rel="noopener">Playground — Hair & Faces ↗</a></div><div class="card"><h3>Одежда</h3><p>Каталоги пользовательской одежды</p><a href="https://sims-market.ru/cat/sims-4/odezhda/?page=2" target="_blank" rel="noopener">Sims-Market ↗</a><br><a href="https://good-mods.com/sims-4/odezhda/" target="_blank" rel="noopener">Good-Mods ↗</a><br><a href="https://sims4package.com/odezhda/" target="_blank" rel="noopener">Sims4Package ↗</a></div><div class="card"><h3>Главный каталог</h3><p>Общий поиск пользовательского контента</p><a href="https://ccthesims.com/" target="_blank" rel="noopener">CC The Sims ↗</a></div><div class="card"><h3>Обувь</h3><p>Отдельные каталоги обуви и обувных коллекций</p><a href="https://www.patreon.com/jiussims" target="_blank" rel="noopener">Jius ↗</a><br><a href="https://www.patreon.com/cw/madlen/home" target="_blank" rel="noopener">Madlen ↗</a><br><a href="https://dallasgirl79.tumblr.com/dg-shoes" target="_blank" rel="noopener">DallasGirl ↗</a></div><div class="card"><h3>Build & Buy / интерьер</h3><p>Мебель, декор, объекты, наборы комнат и функциональный CC</p><a href="https://www.thesimsresource.com/" target="_blank" rel="noopener">TSR ↗</a><br><a href="https://ccthesims.com/" target="_blank" rel="noopener">CC The Sims ↗</a><br><a href="https://thesimscatalog.com/sims4/" target="_blank" rel="noopener">The Sims Catalog ↗</a></div><div class="card"><h3>Макияж и аксессуары</h3><p>Поиск косметики, украшений, деталей лица и декоративных дополнений.</p><a href="https://www.thesimsresource.com/" target="_blank" rel="noopener">TSR — общий каталог ↗</a><br><a href="https://thesimscatalog.com/sims4/" target="_blank" rel="noopener">The Sims Catalog ↗</a></div><div class="card"><h3>Build / Buy и интерьер</h3><p>Мебель, декор, свет, функциональные предметы и наборы для оформления комнат.</p><a href="https://www.thesimsresource.com/" target="_blank" rel="noopener">TSR ↗</a><br><a href="https://ccthesims.com/" target="_blank" rel="noopener">CC The Sims ↗</a></div><div class="card"><h3>CC по типу контента</h3><p>Подборка для поиска по внешнему виду, а не только имени создателя: лица, волосы, одежда, обувь, интерьер.</p><a href="https://www.playground.ru/sims_4/file/hair_and_faces" target="_blank" rel="noopener">Playground — Hair & Faces ↗</a></div></div></section><section class="section"><h2>Исходные каталоги</h2><div class="grid"><div class="card"><b>The Sims Resource</b><p>Каталог CC</p><a href="https://www.thesimsresource.com/" target="_blank">Открыть ↗</a></div><div class="card"><b>CC The Sims</b><p>Подборки и авторы</p><a href="https://ccthesims.com/" target="_blank">Открыть ↗</a></div><div class="card"><b>The Sims Catalog</b><p>CC категории</p><a href="https://thesimscatalog.com/sims4/" target="_blank">Открыть ↗</a></div></div></section>`,translations:()=>`<div class="pagehead"><h1>Русификаторы и переводы</h1><p>Переводы модов Sims 4 с привязкой к оригиналу, автору, версии и статусу проверки.</p></div><div class="grid"><div class="card"><h3>Переводчик модов</h3><p>Онлайн-инструмент: загрузка package, перевод текста, заявлено 11 языков и общий кэш переводов.</p><a href="https://xn--e1agacrzcbcc.xn-p1ai/ru/translator" target="_blank" rel="noopener">Открыть переводчик ↗</a></div><div class="card"><h3>Перенос переводов</h3><p>Отдельный инструмент сайта для переноса переводов.</p><a href="https://xn--e1agacrzcbcc.xn-p1ai/ru/tools" target="_blank" rel="noopener">Посмотреть инструменты ↗</a></div><div class="card"><h3>Другие инструменты для Sims</h3><p>Главное меню, интро, шрифты, удаление и замена пламбоба, Mod Manager.</p><a href="https://xn--e1agacrzcbcc.xn-p1ai/ru/tools" target="_blank" rel="noopener">Список инструментов ↗</a></div></div><div class="pagehead"><h2>Как будем вести русификаторы</h2><p>Перевод — отдельный файл, он не заменяет оригинальный мод. Проверяем соответствие версий и установку рядом с модом.</p></div><div class="grid"><div class="card"><h3>Package-переводы</h3><p>Чаще всего кладутся рядом с оригинальным модом. Не переименовываем файлы-переводы, если автор задаёт специальный порядок загрузки.</p></div><div class="card"><h3>Script / JSON / XML</h3><p>Установка зависит от конкретного мода: папка Translations, соседняя папка или инструкция автора. Не публикуем универсальные правила там, где их нет.</p></div><div class="card"><h3>Сверка версий</h3><p>Если обновился оригинал, старый перевод автоматически помечаем «требует проверки», пока не подтверждена совместимость.</p></div></div><div class="pagehead"><h2>Правила качественного перевода</h2><p>Перевод должен выглядеть так, будто текст изначально написан по-русски, но технические данные мода остаются нетронутыми.</p></div><div class="grid"><div class="card"><h3>Перед началом</h3><p>Проверяем страницу оригинала, автора, дату обновления, версию игры и список файлов. Если в пакете несколько STBL, переводим все нужные таблицы, а не только первую найденную.</p></div><div class="card"><h3>Ключи и идентификаторы</h3><p>Не меняем STBL string keys, GROUP, INSTANCE и технические идентификаторы. Они связывают игровые строки между ресурсами.</p></div><div class="card"><h3>Токены и динамический текст</h3><p>Сохраняем {0.SimFirstName}, {0.String}, плейсхолдеры, ветки M/F, числа, имена персонажей и служебные вставки. Если меняется грамматика - адаптируем фразу, но не удаляем токены.</p></div><div class="card"><h3>Нативный русский</h3><p>Не калькируем английский порядок слов. Названия взаимодействий, уведомления, описания черт, навыков и мудлетов должны звучать коротко, естественно и в стиле Sims.</p></div><div class="card"><h3>Проверка после экспорта</h3><p>Открываем мод в игре на целевом языке: взаимодействия, подсказки, меню выбора, уведомления, описания и динамические строки проверяем отдельно.</p></div><div class="card"><h3>Обновление перевода</h3><p>После новой версии оригинала сравниваем список ключей: новые строки временно оставляем с исходным английским текстом, пока не переведём и не проверим их.</p></div><div class="card"><h3>Где переводить вручную</h3><p>Если автоматический перевод не подходит, используем STBL Studio: английский источник, выбранная целевая локаль, редактирование строк и экспорт string table.</p><a href="https://andirz.com/modding/translating-mods/" target="_blank" rel="noopener">Открыть инструкцию ↗</a></div><div class="card"><h3>Что не переводим</h3><p>Не редактируем игровые настройки, tuning, tests, loot actions, buffs и другие ресурсы геймплея ради локализации. Работаем только с текстовыми значениями.</p></div></div><div class="card"><h3>Другой каталог русификаторов</h3><p>Есть подборка переводов для популярных модов, включая MCCC, WickedWhims, RPO, UI Cheats, Meaningful Stories, Better BuildBuy, Slice of Life, моды Adeepindigo, Road to Fame и другие.</p><a href="https://sims4package.com/rusifikatory/" target="_blank" rel="noopener">Открыть каталог русификаторов ↗</a></div><div class="card"><h3>Каталог переводов</h3><p>Добавляем русификаторы, сверяем их с версиями оригинальных модов и отмечаем обновления. Ссылки ведут на страницы авторов и источники, файлы без разрешения не перезаливаем.</p><a href="https://xn--e1agacrzcbcc.xn--p1ai/ru" target="_blank" rel="noopener">Открыть сайт с переводами ↗</a></div><div class="grid"><div class="card"><h3>Актуальность</h3><p>Версия перевода и дата проверки</p><span class="chip">Проверка источника</span></div><div class="card"><h3>Связь с оригиналом</h3><p>Ссылка на мод и его автора</p><span class="chip">Обязательно</span></div><div class="card"><h3>Статус</h3><p>Актуален · Устарел · Требует проверки</p><span class="chip">Без догадок</span></div></div><div class="notice">Основной источник переводов: <a href="https://xn--e1agacrzcbcc.xn--p1ai/ru" target="_blank" rel="noopener">Русификаторы модов</a>. Каталог переводов будет наполняться по мере проверки страниц и версий.</div>`,compat:()=>`<div class="pagehead"><h1>Compatibility Center</h1><p>Patch tracker, dependencies, conflict checks and Mods folder hygiene.</p></div><div class="notice"><b>Current EA patch:</b> 1.129.39.1030 (PC) / 1.129.39.1230 (Mac) · October 27, 2026. A game update can invalidate previously safe mod statuses; never treat an older check as current.</div><div class="grid"><div class="card feature"><h3>Version check</h3><p>Compare game version against the creator’s update notes and patch-day tracker.</p></div><div class="card feature"><h3>Dependencies</h3><p>Check required libraries and core modules before installing a mod.</p></div><div class="card feature"><h3>Conflicts</h3><p>Look for duplicate overrides, overlapping gameplay systems and outdated copies.</p></div><div class="card feature"><h3>Mods folder</h3><p>Review script depth, package duplicates, archives and old versions.</p></div></div><section class="section"><h2>Latest patch references</h2><div class="grid"><div class="card"><h3>EA official patch notes</h3><p>1.129.39.1030 / Mac 1.129.39.1230, October 27, 2026.</p><a href="https://www.ea.com/games/the-sims/the-sims-4/news/update-10-27-2026" target="_blank" rel="noopener">Read official update ↗</a></div><div class="card"><h3>Patch tracking</h3><p>Use this tracker to identify patch-day status resets and modder confirmations.</p><a href="https://app.ts4modhound.com/visitor/patch_day_list" target="_blank" rel="noopener">TS4 Mod Hound Patch Log ↗</a></div><div class="card"><h3>EA Mod update guide</h3><p>EA recommends checking outdated or conflicting mod files after game updates.</p><a href="https://www.ea.com/" target="_blank" rel="noopener">EA official site ↗</a></div></div></section><section class="section"><h2>Compatibility status meanings</h2><div class="grid"><div class="card"><span class="chip" style="color:var(--mint)">Verified for patch</span><p>Author/source explicitly confirms the current game version.</p></div><div class="card"><span class="chip">Needs review</span><p>No current patch confirmation or details are incomplete.</p></div><div class="card"><span class="chip">Known issue</span><p>Source documents a problem, conflict or broken feature.</p></div><div class="card"><span class="chip">Dependency missing</span><p>A required library or companion file is not installed.</p></div></div><div class="notice">Statuses are not automatically assigned from release dates. A mod is marked verified only when an accessible primary source supports that claim.</div></section><section class="section"><h2>Patch day checklist</h2><p class="meta">Отмечай этапы при подготовке игры после обновления.</p><div class="card"><div id="patchchecklist"><label style="display:block;margin:8px 0"><input type="checkbox" onchange="patchChecklist()"> Backup saves and Mods folder</label><label style="display:block;margin:8px 0"><input type="checkbox" onchange="patchChecklist()"> Check EA patch notes and current game version</label><label style="display:block;margin:8px 0"><input type="checkbox" onchange="patchChecklist()"> Remove duplicate/old versions of mods</label><label style="display:block;margin:8px 0"><input type="checkbox" onchange="patchChecklist()"> Update core libraries and script mods from creator sources</label><label style="display:block;margin:8px 0"><input type="checkbox" onchange="patchChecklist()"> Test with a clean batch of updated mods first</label><label style="display:block;margin:8px 0"><input type="checkbox" onchange="patchChecklist()"> Add CC and gameplay mods in groups; isolate issues if errors appear</label></div><p id="patchprogress" class="meta">0 / 6 steps completed</p><button class="btn alt" onclick="resetPatchChecklist()">Reset checklist</button></div></section>`,realism:()=>`<div class="pagehead"><h1>Realism Hub</h1><p>Реализм — целостная система жизненных механик, а не случайная подборка.</p></div><div class="grid"><div class="card feature"><h3>Health & Care</h3><p>Болезни, медицина, профилактика, уход</p></div><div class="card feature"><h3>Pregnancy & Birth</h3><p>Планирование, беременность, роды, восстановление</p></div><div class="card feature"><h3>Relationships</h3><p>Знакомства, совместимость, кризисы, развод</p></div><div class="card feature"><h3>Psychology</h3><p>Эмоции, память, черты, нейроразнообразие</p></div><div class="card feature"><h3>Money & Work</h3><p>Бюджет, долги, карьера, бизнес</p></div><div class="card feature"><h3>Education</h3><p>Школа, университет, кружки</p></div><div class="card feature"><h3>Daily Life</h3><p>Питание, уборка, покупки, привычки</p></div><div class="card feature"><h3>Body & Fitness</h3><p>Форма, активность, образ жизни</p></div><div class="card feature"><h3>Death & Grief</h3><p>Утрата, память, семейные последствия</p></div><div class="card feature"><h3>Seasons</h3><p>Погода, сезонность, окружение</p></div><div class="card feature"><h3>Pets</h3><p>Поведение, здоровье, уход</p></div><div class="card feature"><h3>City & Transport</h3><p>Передвижение и городской быт</p></div></div><div class="pagehead"><h2>Стартовая подборка по направлениям</h2><p>Ссылки на страницы авторов. Все позиции отмечены как требующие проверки текущей версии и зависимостей перед рекомендацией.</p></div><div class="cards"><article class="card"><div class="body"><h3>Healthcare Redux</h3><div class="meta">Здоровье · медицина · заболевания</div><p>Болезни, здоровье, медицинские игровые события.</p><a href="https://www.patreon.com/adeepindigo" target="_blank" rel="noopener">Adeepindigo ↗</a><span class="chip">Проверить версию</span></div></article><article class="card"><div class="body"><h3>Divergent Sims</h3><div class="meta">Психология · нейроразнообразие</div><p>Механики нейроразнообразия и связанные системы.</p><a href="https://www.patreon.com/adeepindigo" target="_blank" rel="noopener">Adeepindigo ↗</a><span class="chip">Проверить требования</span></div></article><article class="card"><div class="body"><h3>Relationship & Pregnancy Overhaul</h3><div class="meta">Отношения · беременность · семья</div><p>Модульные системы семейных решений, отношений и беременности.</p><a href="https://www.patreon.com/lumpinou" target="_blank" rel="noopener">Lumpinou ↗</a><span class="chip">Модули сверить</span></div></article><article class="card"><div class="body"><h3>Meaningful Stories</h3><div class="meta">Эмоции · настроение</div><p>Более последовательная эмоциональная система и настроение.</p><a href="https://roburky.itch.io/meaningful-stories" target="_blank" rel="noopener">roBurky ↗</a><span class="chip">Проверить совместимость</span></div></article><article class="card"><div class="body"><h3>MC Command Center</h3><div class="meta">Автономия · управление городом</div><p>Настройки населения, автономии, семей и игровых процессов.</p><a href="https://deaderpool-mccc.com/" target="_blank" rel="noopener">Deaderpool ↗</a><span class="chip">Core mod</span></div></article><article class="card"><div class="body"><h3>Basemental</h3><div class="meta">18+ · взрослый геймплей</div><p>Отдельная возрастная категория, проверяем зависимости и требования.</p><a href="https://basementalmods.com/" target="_blank" rel="noopener">Официальный сайт ↗</a><span class="chip">18+ · Проверка</span></div></article></div><div class="notice">Статусы здесь не означают, что проверка совместимости уже проведена. Сначала сверяем релиз и документацию автора, затем отмечаем карточку как проверенную.<br>Стартовые внешние подборки для дальнейшей проверки: <a href="https://boosty.to/ceyach/posts/9f9f5647-6be9-479c-afa6-66f5f5cb22d7" target="_blank" rel="noopener">Ceyach — realism ↗</a> · <a href="https://boosty.to/kkk365/posts/33ae3e22-3d1d-4789-8917-d07131cde312" target="_blank" rel="noopener">KKK365 ↗</a> · <a href="https://boosty.to/sabrisims/posts/6ca183f8-1903-4c15-94b3-370fe695ad1d" target="_blank" rel="noopener">SabriSims ↗</a></div>`,collections:()=>`<div class="pagehead"><h1>Collections & Navigators</h1><p>Сценарии сборки с понятной очередностью, без случайного скачивания десятков модов.</p></div><div class="notice">Это curated starting points: список не означает, что все версии модов проверены на текущем патче. Открывай карточки и сверяй requirements у автора.</div><div class="grid"><div class="card"><h3>Realistic Life</h3><p>Собирай жизненные системы поэтапно: здоровье → психология → отношения и семья → работа/образование → повседневность.</p><p class="meta">Порядок: core dependencies → healthcare → emotional systems → relationships → lifestyle. Не ставь сразу несколько модов, меняющих одну механику.</p><button class="btn alt" onclick="openModSearch('Realism')">Найти realism-моды</button></div><div class="card"><h3>CAS Essentials</h3><p>Базовый CAS: skin details, глаза, брови, пресеты, макияж. Сначала non-default контент, потом осторожно выбирай default replacements.</p><p class="meta">Правило: не устанавливай несколько replacements для одного ресурса.</p><button class="btn alt" onclick="go('cc');showCCFinder('skin')">Открыть Skin & Genetics</button></div><div class="card"><h3>Wardrobe</h3><p>Капсула: повседневная, сезонная, обувь, formal, спорт. Выбирай по стилю и фильтруй дубли, meshes и body compatibility.</p><p class="meta">Направления авторов: Greenllamas · Trillyke · Sentate.</p><button class="btn alt" onclick="go('cc');showCCFinder('clothes')">Открыть Clothing</button></div><div class="card"><h3>Cozy Home</h3><p>Мебель, свет, декор, clutter и тематические наборы. Скачивай коллекциями, сохраняя список сетов и их meshes.</p><p class="meta">Проверяй: mesh, функциональность, required packs, количество файлов.</p><button class="btn alt" onclick="go('cc');showCCFinder('bb')">Открыть Build/Buy</button></div><div class="card"><h3>Core Mods</h3><p>Инструменты, библиотеки и UI. Core и dependency-моды ставятся до зависимых модов; не держи две версии одной библиотеки.</p><p class="meta">MC Command Center · Lot 51 Core · XML Injector — проверяй требования у каждого мода отдельно.</p><button class="btn alt" onclick="openModSearch('Dependency')">Найти библиотеки</button></div><div class="card"><h3>Patch Day Rescue</h3><p>Backup → проверить версию → убрать старые копии → обновить core и script mods → тестировать небольшими группами → вернуть основной сейв.</p><button class="btn alt" onclick="go('compat')">Открыть Compatibility Center</button></div></div><section class="section"><h2>Сборка без хаоса: порядок установки</h2><div class="card"><ol><li>Создай резервную копию папок Saves и Mods.</li><li>Установи библиотеки и необходимые dependencies.</li><li>Добавляй gameplay/script mods одной тематической группой.</li><li>Запусти игру и проверь эту группу.</li><li>Добавляй CC отдельными категориями (CAS, обувь, Build/Buy).</li><li>После проверки зафиксируй название, автора, дату и источник - так проще искать конфликт.</li></ol></div></section>`,manager:()=>`<section class="managerHero"><div class="eyebrow">SIMS UNIVERSE · MOD CARE</div><h1>Порядок в Mods.<br><span>Контроль над игрой.</span></h1><p>Управляй модами в одном месте: находи обновления, конфликты, дубликаты и повреждённые файлы. Сохраняй резервные копии и возвращайся к безопасной версии.</p><div class="actions"><label class="btn" for="managerFolderInput">✦ Проверить мою папку Mods</label><button class="btn alt" onclick="managerChooseWritable()">Открыть Mods с управлением файлами</button><button class="btn alt" onclick="managerSelfTest()">Тесты Mod Manager</button><div id="managerWritableActions" class="managerActionBar" style="display:none"><button class="btn alt" onclick="managerBackupAll()">Создать полный бэкап</button><button class="btn alt" onclick="managerQuarantineEmpty()">Убрать пустые (с бэкапом)</button><button class="btn alt" onclick="managerQuarantineExactDuplicates()">Убрать точные дубли (с бэкапом)</button><button class="btn alt" onclick="managerRestoreLatest()">Восстановить последний бэкап</button></div><input id="managerFolderInput" type="file" webkitdirectory directory multiple style="display:none" onchange="managerScanNew(event)"><button class="btn alt" onclick="managerDemo()">Посмотреть пример</button></div><div class="managerPills"><span>Проверка структуры</span><span>Обновления</span><span>Конфликты</span><span>Сейвы</span><span>Бэкапы</span></div></section><section class="managerStats"><div class="card"><strong>01</strong><h3>Сначала — сканирование</h3><p>Файлы, типы, размеры, пустые файлы и подозрительная вложенность.</p></div><div class="card"><strong>02</strong><h3>Всё под контролем</h3><p>Установленные моды, версии и статус обновления в одном списке.</p></div><div class="card"><strong>03</strong><h3>Безопасные действия</h3><p>Перед удалением, заменой или изменением сейва — отдельный бэкап.</p></div></section><section class="card managerScan"><div class="managerScanTop"><div><h2>Состояние папки Mods</h2><p class="meta">Выбери папку Sims 4/Mods — результаты появятся здесь.</p></div><span class="managerBadge">LOCAL SCAN</span></div><div id="managerNewStats" class="managerCounts"><div class="managerCount"><b>—</b><span>Файлов</span></div><div class="managerCount"><b>—</b><span>Дубликатов</span></div><div class="managerCount"><b>—</b><span>Пустых</span></div><div class="managerCount"><b>—</b><span>Проблем</span></div></div><div id="managerNewResults" class="managerResults"><div class="managerEmpty"><div class="managerEmptyIcon">✦</div><h3>Папка ещё не проверена</h3><p>Сканирование работает прямо в браузере. Файлы не загружаются на сервер.</p></div></div></section><section class="managerFeatureGrid"><article class="card"><div class="featureIcon">↻</div><h3>Моды и обновления</h3><p>Список установленных модов с версиями и отметкой «Есть обновление». Наши моды — отобраны и переведены; перевод поставляется вместе с модом.</p><span class="featureStatus">Планируется: каталог версий и проверка источников</span></article><article class="card"><div class="featureIcon">⌁</div><h3>Конфликты и повреждения</h3><p>Поиск дублей, пустых файлов, повторяющихся ресурсов и конфликтующих замен. Визуальная диагностика вместо угадывания по названиям.</p><span class="featureStatus">Сейчас: дубликаты по имени, пустые файлы и структура</span></article><article class="card"><div class="featureIcon">▣</div><h3>Экран загрузки и главное меню</h3><p>Лента оформления с безопасной заменой: менеджер должен отключить предыдущий override прежде, чем применить новый.</p><span class="featureStatus">Планируется: база проверенных замен</span></article><article class="card"><div class="featureIcon">♡</div><h3>Проверка и лечение сейвов</h3><p>Проверка целостности, версии слота, копии сохранений и предложение отката к живому бэкапу.</p><span class="featureStatus">Планируется: локальный модуль анализа Save</span></article><article class="card"><div class="featureIcon">⛨</div><h3>Бэкап перед каждым действием</h3><p>Все изменения должны быть обратимыми: отдельная папка резервных копий и история действий.</p><span class="featureStatus">Планируется: файловые операции с подтверждением</span></article><article class="card"><div class="featureIcon">⇄</div><h3>Перевод из приложения</h3><p>Отправить мод без русского в переводчик Sims Universe и вернуть готовый перевод в исходную папку без ручной распаковки.</p><span class="featureStatus">Связка с переводчиком — в разработке</span></article></section><section class="card managerRoadmap"><h2>Сделано сейчас · Честно о возможностях браузера</h2><p>Этот сайт может прочитать выбранную папку и диагностировать её содержимое, но не меняет файлы игры без отдельного разрешения файловой системы. Автоматическая установка/отключение, проверка содержимого package, лечение сохранений и каталог актуальных версий требуют следующего этапа разработки локального приложения или браузерного API с явными правами доступа.</p><button class="btn alt" onclick="go('tools')">Открыть инструменты и переводчик</button></section>`,tools:()=>`<div class="pagehead"><h1>Tools</h1><p>Практические инструменты Sims Universe: менеджер Mods и мастер перевода.</p></div><section class="card"><h2>🗂️ Mod Manager — сканирование папки</h2><p>Выбери папку Mods. Сайт прочитает названия, типы, размер и структуру файлов. Это диагностический список: файлы на компьютере не перемещаются и не отключаются.</p><div class="toolbar"><label class="btn alt" for="modsFolderInput">Выбрать папку Mods</label><input id="modsFolderInput" type="file" webkitdirectory directory multiple style="display:none" onchange="scanModsFolder(event)"><input id="managerSearch" placeholder="Фильтр по названию…" oninput="drawModManager()"><select id="managerType" onchange="drawModManager()"><option value="">Все типы</option><option value="script">Script mods</option><option value="package">Package / CC</option><option value="other">Другие файлы</option></select></div><div id="managerStats" class="meta">Папка ещё не выбрана</div><div id="managerWarnings" class="notice" style="display:none"></div><div id="managerList" class="cards"></div></section><section class="card" style="margin-top:16px"><h2>↔ Mod Translator — мастер перевода</h2><p>Вставляй оригинальные строки, добавляй русский перевод, сохраняй черновик в браузере и выгружай TSV. AI-перевод пока не подключён.</p><div class="toolbar"><button class="btn alt" onclick="translatorLoadSample()">Пример</button><button class="btn alt" onclick="translatorAddRow()">+ Строка</button><button class="btn alt" onclick="translatorSave()">Сохранить черновик</button><button class="btn alt" onclick="translatorExport()">Экспорт TSV</button><button class="btn alt" onclick="translatorClear()">Очистить</button></div><div class="toolbar"><input id="translatorModName" placeholder="Название мода" oninput="translatorUpdateMeta()"><input id="translatorLanguage" value="Russian (Русский)" placeholder="Язык" oninput="translatorUpdateMeta()"></div><div id="translatorMeta" class="meta">0 строк</div><div id="translatorRows"></div><div class="notice">Этот инструмент пока организует строки, но не редактирует STBL внутри .package. Для готового файла нужен отдельный STBL-процессор.</div></section>`,guides:()=>`<section class="pagehead"><h1>Guides & Help</h1><p>Практические инструкции по установке и обслуживанию Sims 4.</p></section><div class="grid"><article class="card"><h3>Структура Mods</h3><p>Package можно раскладывать по папкам. Script mods держи неглубоко и проверяй требования авторов.</p></article><article class="card"><h3>После патча</h3><p>Сделай backup Saves, временно убери Mods, проверь версии script mods и libraries, возвращай файлы партиями.</p></article><article class="card"><h3>Поиск конфликтов</h3><p>Используй отчёт ResourceKey, затем тестируй конфликтующие группы. Совпадение ресурса не всегда означает несовместимость.</p></article><article class="card"><h3>Overrides и Defaults</h3><p>Replacement файлы могут перекрывать одинаковые ресурсы. Устанавливай только один намеренный override для одной области.</p></article></div>`};
const LIB_KEY="simsuniverse_personal_library_v1";function getLibrary(){try{return JSON.parse(localStorage.getItem(LIB_KEY)||"[]")}catch(e){return []}}function saveLibEntry(entry){let lib=getLibrary(),key=entry.type+"|"+entry.title+"|"+entry.creator;if(lib.some(x=>x.key===key)){alert("Уже сохранено в Personal Library");return}entry.key=key;lib.unshift(entry);localStorage.setItem(LIB_KEY,JSON.stringify(lib));alert("Сохранено в Personal Library")}function saveModByName(title,creator){let m=mods.find(x=>x[0]===title&&x[1]===creator);if(m)saveLibEntry({type:"mod",title:m[0],creator:m[1],category:m[2],description:m[4],url:m[5]})}function saveCreatorByName(title){let a=authors.find(x=>x[0]===title);if(a)saveLibEntry({type:"creator",title:a[0],creator:a[1],category:"",description:"",url:a[2]})}function saveCCSet(title,creator,category,description,url){saveLibEntry({type:"cc",title,creator,category,description,url,collection:"Build/Buy"})}const LIB_COLLECTION_KEY="simsuniverse_library_collections_v1";const LIB_DEFAULTS=["CAS","Build/Buy","Realism","Gameplay","Установить позже"

];function getLibraryCollections(){try{return JSON.parse(localStorage.getItem(LIB_COLLECTION_KEY)||"null")||LIB_DEFAULTS.slice()}catch(e){return LIB_DEFAULTS.slice()}}function escLib(s){return String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;")}function createLibraryCollection(){let inp=document.getElementById("newcollection"),name=(inp?.value||"").trim();if(!name)return;if(getLibraryCollections().some(x=>x.toLowerCase()===name.toLowerCase())){alert("Такая коллекция уже есть");return}let arr=getLibraryCollections();arr.push(name);localStorage.setItem(LIB_COLLECTION_KEY,JSON.stringify(arr));if(inp)inp.value="";drawLibrary()}function assignLibraryCollection(key,value){let lib=getLibrary(),item=lib.find(x=>x.key===key);if(item){item.collection=value;localStorage.setItem(LIB_KEY,JSON.stringify(lib));drawLibrary()}}function drawLibrary(){let lib=getLibrary(),el=document.getElementById("librarycount"),grid=document.getElementById("librarygrid"),filter=document.getElementById("libfilter"),collections=getLibraryCollections(),active=filter?.value||"";if(filter){filter.innerHTML='<option value="">Все коллекции</option>'+collections.map(x=>'<option value="'+escLib(x)+'"'+(x===active?' selected':'')+'>'+escLib(x)+'</option>').join("")}let shown=active?lib.filter(x=>(x.collection||"")===active):lib;if(el)el.textContent="Сохранено: "+shown.length+" из "+lib.length+" · коллекций: "+collections.length;if(grid)grid.innerHTML=shown.map(x=>'<article class="card"><div class="body"><span class="chip">'+(x.type==="mod"?"MOD":x.type==="cc"?"CC":"CREATOR")+'</span><h3>'+escLib(x.title)+'</h3><div class="meta">'+escLib(x.creator)+(x.category?' · '+escLib(x.category):'')+'</div>'+(x.description?'<p>'+escLib(x.description)+'</p>':'')+'<p><a href="'+escLib(x.url)+'" target="_blank" rel="noopener">Открыть оригинальный источник ↗</a></p><label>Коллекция</label><select onchange="assignLibraryCollection(this.dataset.key,this.value)" data-key="'+escLib(x.key)+'"><option value="">Без коллекции</option>'+collections.map(z=>'<option value="'+escLib(z)+'"'+(z===x.collection?' selected':'')+'>'+escLib(z)+'</option>').join("")+'</select><button class="btn alt" onclick="removeLibraryItem(this.dataset.key)" data-key="'+escLib(x.key)+'">Удалить из библиотеки</button></div></article>').join("")||"Пока ничего не сохранено в этой коллекции."}function removeLibraryItem(key){localStorage.setItem(LIB_KEY,JSON.stringify(getLibrary().filter(x=>x.key!==key)));drawLibrary()}function clearLibrary(){if(confirm("Удалить все сохранённые элементы?")){localStorage.removeItem(LIB_KEY);drawLibrary()}}function go(p){document.querySelectorAll("#nav button").forEach(b=>b.classList.toggle("active",b.dataset.p===p));document.getElementById("crumb").textContent="SIMS UNIVERSE / "+p.toUpperCase();document.getElementById("content").innerHTML=pages[p]();if(p==="mods"){populateModCategories();drawMods();}if(p==="creators"){populateAuthorCategories();drawAuthors();}if(p==="cc"){loadCCChecklist();populateCCCategories();drawCCSources();}if(p==="library")drawLibrary();window.scrollTo(0,0)}

async function managerGetBackupDir(){if(!managerWritableRoot)throw Error("Сначала выбери папку Mods");const root=await managerWritableRoot.getDirectoryHandle(".simsuniverse-backups",{create:true});const stamp=new Date().toISOString().replace(/[:.]/g,"-");const op=await root.getDirectoryHandle("backup-"+stamp,{create:true});managerLastBackupFolder=op;return op}
async function managerCopyToDir(dir,rel,file){const parts=rel.split("/").filter(Boolean);let target=dir;for(let i=0;i<parts.length-1;i++)target=await target.getDirectoryHandle(parts[i],{create:true});const fh=await target.getFileHandle(parts.at(-1),{create:true});const w=await fh.createWritable();await w.write(file);await w.close();const verify=await fh.getFile();if(verify.size!==file.size)throw Error("Размер копии не совпал: "+rel);return fh}
async function managerBackupItems(items,reason){if(!items.length){alert("Нет файлов для операции");return null}const dest=await managerGetBackupDir(),manifest=[];for(const item of items){const copyHandle=await managerCopyToDir(dest,item.path,item.file);const copied=await copyHandle.getFile();const hash=await managerHashFile(copied),origHash=item.hash||await managerHashFile(item.file);if(copied.size!==item.file.size||hash!==origHash)throw Error("Проверка бэкапа не прошла: "+item.path);manifest.push({path:item.path,size:item.file.size,sha256:hash,reason})}const mf=await dest.getFileHandle("manifest.json",{create:true}),mw=await mf.createWritable();await mw.write(JSON.stringify({createdAt:new Date().toISOString(),reason,files:manifest},null,2));await mw.close();return dest}
async function managerHashFile(file){return Array.from(new Uint8Array(await crypto.subtle.digest("SHA-256",await file.arrayBuffer()))).map(b=>b.toString(16).padStart(2,"0")).join("")}
async function managerQuarantineItems(items,reason){if(!items.length){alert("Не найдено файлов для безопасной операции");return}if(!confirm("Сначала будет создан и проверен бэкап "+items.length+" файлов. Затем копии попадут в карантин; оригиналы удалятся только после проверки всех копий. Продолжить?"))return;let qdir=null,backedUp=false,copied=[],removed=[];try{const backup=await managerBackupItems(items,reason);if(!backup)throw Error("Backup не создан");backedUp=true;const qroot=await managerWritableRoot.getDirectoryHandle(".simsuniverse-quarantine",{create:true}),stamp=new Date().toISOString().replace(/[:.]/g,"-");qdir=await qroot.getDirectoryHandle("quarantine-"+stamp,{create:true});for(const item of items){const dest=await managerCopyToDir(qdir,item.path,item.file),verify=await dest.getFile();const expected=item.hash||await managerHashFile(item.file),actual=await managerHashFile(verify);if(verify.size!==item.file.size||actual!==expected)throw Error("Копия карантина не прошла SHA-256: "+item.path);copied.push(item)}for(const item of copied){await item.parent.removeEntry(item.handle.name);removed.push(item)}await managerScanWritable();alert("Готово: "+removed.length+" файлов перенесено в карантин. Backup и quarantine-копии проверены по SHA-256.")}catch(e){let rollbackErrors=[];for(const item of removed){try{const backupCopy=await managerFindCopy(qdir,item.path),file=await backupCopy.getFile();await managerCopyToDir(managerWritableRoot,item.path,file)}catch(re){rollbackErrors.push(item.path+": "+re.message)}}if(qdir&&copied.length){for(const item of copied){try{const parentParts=item.path.split("/");let dir=qdir;for(let n=0;n<parentParts.length-1;n++)dir=await dir.getDirectoryHandle(parentParts[n]);await dir.removeEntry(parentParts[parentParts.length-1])}catch(re){}}}try{await managerScanWritable()}catch{}alert("Операция отменена/не завершилась: "+e.message+(backedUp?"\nРезервная копия создана.":"")+(rollbackErrors.length?"\nНе удалось откатить автоматически: "+rollbackErrors.join("; "):"\nОригиналы восстановлены при откате."))}}\nasync function managerFindCopy(root,rel){const parts=rel.split("/");let dir=root;for(let i=0;i<parts.length-1;i++)dir=await dir.getDirectoryHandle(parts[i]);return dir.getFileHandle(parts.at(-1))}
function managerSelfTest(){const tests=[{name:"Valid DBPF header with empty index",ok:()=>{const b=new ArrayBuffer(96),d=new DataView(b);new Uint8Array(b).set([68,66,80,70]);d.setUint32(4,2,true);d.setUint32(8,1,true);d.setUint32(20,0,true);d.setUint32(24,96,true);d.setUint32(28,0,true);return managerValidateDbpfHeader(b,96).valid}},{name:"Reject wrong magic",ok:()=>{const b=new ArrayBuffer(96);return !managerValidateDbpfHeader(b,96).valid}},{name:"Reject out-of-bounds index",ok:()=>{const b=new ArrayBuffer(96),d=new DataView(b);new Uint8Array(b).set([68,66,80,70]);d.setUint32(20,2,true);d.setUint32(24,90,true);d.setUint32(28,20,true);d.setUint32(36,16,true);return !managerValidateDbpfHeader(b,96).valid}}];const out=tests.map(t=>({name:t.name,pass:t.ok()})),pass=out.filter(x=>x.pass).length;const host=document.getElementById("managerNewResults");host.innerHTML='<article class="managerFinding '+(pass===out.length?"ok":"warn")+'"><h4>Mod Manager self-tests: '+pass+'/'+out.length+' passed</h4><p>'+out.map(x=>(x.pass?"✓ ":"✗ ")+escapeTranslator(x.name)).join("<br>")+'</p></article><article class="managerFinding"><h4>Покрытие</h4><p>Тестируются DBPF сигнатура, безопасная проверка диапазона индекса и rejection некорректных заголовков. Нужны реальные package fixtures для resource-key parser/conflict tests.</p></article>'}
function managerValidateDbpfHeader(buffer,fileSize){try{if(fileSize<96||buffer.byteLength<96)return{valid:false,reason:"too short"};const u=new Uint8Array(buffer,0,4);if(String.fromCharCode(...u)!=="DBPF")return{valid:false,reason:"magic"};const d=new DataView(buffer),count=d.getUint32(20,true),offset=d.getUint32(24,true),size=d.getUint32(28,true),entry=d.getUint32(36,true);if(offset>fileSize||size>fileSize||offset+size>fileSize||(!count&&size)||(count&&(!size||!entry||count*entry>size)))return{valid:false,reason:"index bounds"};return{valid:true,indexCount:count,indexOffset:offset,indexSize:size,entrySize:entry}}catch(e){return{valid:false,reason:"parse error"}}}
async function managerBackupAll(){try{const dest=await managerBackupItems(managerWritableList,"manual-full-backup");if(dest)alert("Бэкап создан и проверен: .simsuniverse-backups. Перед копированием каждого файла проверен размер и SHA-256.")}catch(e){alert("Бэкап не завершён: "+e.message)}}
async function managerQuarantineEmpty(){await managerQuarantineItems(managerWritableList.filter(x=>x.file.size===0),"quarantine-empty")}
async function managerQuarantineExactDuplicates(){const groups=new Map();managerWritableList.forEach(x=>{if(x.hash){const a=groups.get(x.hash)||[];a.push(x);groups.set(x.hash,a)}});const duplicates=[];groups.forEach(a=>{if(a.length>1)duplicates.push(...a.slice(1))});await managerQuarantineItems(duplicates,"quarantine-exact-duplicates")}
async function managerRestoreLatest(){try{const root=await managerWritableRoot.getDirectoryHandle(".simsuniverse-backups");const names=[];for await(const [name,h] of root.entries())if(h.kind==="directory")names.push(name);names.sort().reverse();if(!names.length){alert("Бэкапов пока нет");return}const folder=await root.getDirectoryHandle(names[0]);const mf=await folder.getFileHandle("manifest.json"),manifest=JSON.parse(await(await mf.getFile()).text());if(!confirm("Восстановить "+manifest.files.length+" файлов из "+names[0]+"? Существующие файлы не будут перезаписаны."))return;let restored=0;for(const entry of manifest.files){const parts=entry.path.split("/");let target=managerWritableRoot;for(let i=0;i<parts.length-1;i++)target=await target.getDirectoryHandle(parts[i],{create:true});try{await target.getFileHandle(parts.at(-1));continue}catch(e){}const src=await managerFindCopy(folder,entry.path),file=await src.getFile();if(file.size!==entry.size||await managerHashFile(file)!==entry.sha256)throw Error("Backup verification failed: "+entry.path);await managerCopyToDir(managerWritableRoot,entry.path,file);restored++}await managerScanWritable();alert("Восстановлено "+restored+" файлов. Существующие не затронуты.")}catch(e){alert("Не удалось восстановить: "+e.message)}}
function managerDemo(){document.getElementById("managerNewStats").innerHTML='<div class="managerCount"><b>248</b><span>Файлов</span></div><div class="managerCount"><b>3</b><span>Дубликатов</span></div><div class="managerCount"><b>2</b><span>Пустых</span></div><div class="managerCount"><b>5</b><span>Проблем</span></div>';document.getElementById("managerNewResults").innerHTML='<article class="managerFinding warn"><h4>⚠ Повторяющееся имя: resource.package</h4><p>Gameplay\BetterEvents\resource.package · Overrides\resource.package</p></article><article class="managerFinding warn"><h4>⚠ Script-мод слишком глубоко вложен</h4><p>Gameplay\Subfolder\Extra\Example.ts4script</p></article><article class="managerFinding warn"><h4>⚠ Пустой файл</h4><p>Downloads\broken.package · 0 KB</p></article><article class="managerFinding ok"><h4>✓ Проверка структуры</h4><p>Script Mods: 1 уровень · Package: вложенность допустима</p></article><article class="managerFinding"><h4>↻ Обновления</h4><p>2 модам доступна новая версия (демо-данные)</p></article><article class="managerFinding"><h4>⛨ Резервная копия</h4><p>Перед безопасными операциями создаётся отдельная копия файлов</p></article>'}function translatorUpdateMeta(){let n=document.getElementById("translatorModName")?.value||"Без названия мода",l=document.getElementById("translatorLanguage")?.value||"Russian",m=document.getElementById("translatorMeta");if(m)m.textContent=n+" · "+l+" · "+translatorRows.length+" строк · "+translatorRows.filter(r=>r.trans.trim()).length+" переведено"}
function translatorDraw(){let host=document.getElementById("translatorRows");if(!host)return;host.innerHTML=translatorRows.map((r,i)=>"<div class=\"card\" style=\"margin:8px 0\"><div class=\"meta\">Строка "+(i+1)+"</div><textarea style=\"width:100%;min-height:70px;background:#171420;color:var(--t);border:1px solid var(--line);border-radius:9px;padding:10px\" placeholder=\"Оригинал / English\" onchange=\"translatorSet("+i+",\u0027source\u0027,this.value)\">"+escapeTranslator(r.source)+"</textarea><textarea style=\"width:100%;min-height:70px;margin-top:8px;background:#171420;color:var(--t);border:1px solid var(--line);border-radius:9px;padding:10px\" placeholder=\"Русский перевод\" onchange=\"translatorSet("+i+",\u0027trans\u0027,this.value)\">"+escapeTranslator(r.trans)+"</textarea><button class=\"btn alt\" style=\"margin-top:8px\" onclick=\"translatorRemove("+i+")\">Удалить строку</button></div>").join("");translatorUpdateMeta()}
function escapeTranslator(s){return String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;")}
function translatorSet(i,k,v){if(translatorRows[i])translatorRows[i][k]=v;translatorUpdateMeta()}

function translatorLoadSample(){translatorRows=[{source:"You cannot do this right now.",trans:"Сейчас вы не можете это сделать."},{source:"Ask about their career.",trans:"Спросить о карьере."},{source:"Enable custom content and mods.",trans:"Включите пользовательский контент и моды."}];translatorDraw()}
function translatorExport(){let lines=[["Source","Russian"],...translatorRows.map(r=>[r.source,r.trans])],data=lines.map(r=>r.map(v=>String(v||"").replace(/[\r\n\t]/g," ")).join("\t")).join("\n"),blob=new Blob([data],{type:"text/tab-separated-values;charset=utf-8"}),url=URL.createObjectURL(blob),a=document.createElement("a");a.href=url;a.download=(document.getElementById("translatorModName")?.value||"mod-translation").replace(/[^a-z0-9-_]+/gi,"_")+".tsv";a.click();URL.revokeObjectURL(url)}
