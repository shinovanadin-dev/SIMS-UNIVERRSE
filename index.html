const pages={home,library:()=>`<div class="pagehead"><h1>Personal Library</h1><p>Твои сохранённые моды и авторы. Данные хранятся локально в браузере.</p></div><div class="toolbar"><select id="libfilter" onchange="drawLibrary()"><option value="">Все коллекции</option></select><input id="newcollection" placeholder="Название новой коллекции"><button class="btn alt" onclick="createLibraryCollection()">+ Создать коллекцию</button><button class="btn alt" onclick="clearLibrary()">Очистить библиотеку</button></div><div class="meta" id="librarycount"></div><div class="cards" id="librarygrid"></div><div class="notice">Сохранения доступны только в этом браузере и на этом устройстве. Синхронизации аккаунта пока нет.</div>`,mods:()=>`<div class="pagehead"><h1>Каталог модов</h1><p>Поиск по названию, автору и категории.</p></div><div class="toolbar"><input id="ms" placeholder="Найти мод, автора или описание…" oninput="drawMods()"><select id="mc" onchange="drawMods()"><option value="">Все категории</option></select><button class="btn alt" onclick="clearModFilters()">Сбросить фильтры</button></div><div id="modcount" class="meta" style="margin:0 0 12px"></div><div class="notice">Карточки — стартовые ориентиры. Проверка актуальной версии, требований и совместимости ещё не проставлена.</div><div class="cards" id="modsgrid"></div>`,creators:()=>`<div class="pagehead"><h1>Creator Directory</h1><p>Поиск по автору и направлению творчества.</p></div><div class="toolbar"><input id="as" placeholder="Поиск создателя…" oninput="drawAuthors()"><select id="ac" onchange="drawAuthors()"><option value="">Все направления</option></select><button class="btn alt" onclick="clearAuthorFilters()">Сбросить</button></div><div class="meta" id="authorcount"></div><div class="cards" id="authorsgrid"></div><div class="notice">Направления служат навигацией; каталог работ каждого автора ещё требует исследования.</div>`,cc:()=>`<div class="pagehead"><h1>CC Catalog</h1><p>Навигация по категориям пользовательского контента.</p></div><section class="section"><h2>CC Quick Finder</h2><p class="meta">Выбери категорию - Quick Finder покажет подходящие источники и чек-лист, на что смотреть при скачивании. Ссылки не означают проверку каждого файла.</p><div class="toolbar"><button class="btn alt" onclick="showCCFinder('skin')">Skin & Genetics</button><button class="btn alt" onclick="showCCFinder('hair')">Hair</button><button class="btn alt" onclick="showCCFinder('clothes')">Clothing</button><button class="btn alt" onclick="showCCFinder('shoes')">Shoes</button><button class="btn alt" onclick="showCCFinder('bb')">Build/Buy</button><button class="btn alt" onclick="showCCFinder('details')">Makeup & Details</button></div><div id="ccfinder" class="card"><h3>Выберите категорию</h3><p>Quick Finder переключает ссылки на источники и подсказки по фильтрам.</p></div></section><div class="grid"><div class="card feature" onclick="showCCFinder('skin')"><h3>Genetics & Skin</h3><p>Скины, глаза, пресеты, детали</p></div><div class="card feature" onclick="showCCFinder('hair')"><h3>Hair</h3><p>Женские, мужские, универсальные</p></div><div class="card feature" onclick="showCCFinder('clothes')"><h3>Clothing</h3><p>Cozy, casual, high fashion</p></div><div class="card feature" onclick="showCCFinder('shoes')"><h3>Shoes</h3><p>Обувь и авторские коллекции</p></div><div class="card feature" onclick="showCCFinder('bb')"><h3>Build & Buy</h3><p>Мебель, декор, интерьер</p></div><div class="card feature" onclick="showCCFinder('details')"><h3>Makeup & Details</h3><p>Макияж, украшения, детали</p></div></div><section class="section"><h2>CC Source Finder</h2><p class="meta">Ищи по названию источника или категории. Ссылки ведут к внешним каталогам и страницам авторов.</p><div class="toolbar"><input id="ccsearch" placeholder="Поиск: волосы, одежда, skin, обувь…" oninput="drawCCSources()"><select id="cccategory" onchange="drawCCSources()"><option value="">Все категории</option></select><button class="btn alt" onclick="clearCCSourceFilters()">Сброс</button></div><div class="meta" id="ccsourcecount"></div><div class="cards" id="ccsources"></div></section><section class="section"><h2>Featured Build/Buy Sets</h2><p class="meta">Небольшая подборка объектов, которые добавляют ощущение обжитого пространства. Ссылки ведут на страницы авторов/публикаций.</p><div class="grid"><article class="card"><div class="body"><h3>Cheap & Chipped — Syboulette</h3><div class="meta">37 предметов · Base Game · Build/Buy</div><p>Потёртая, винтажная и бюджетная мебель и строительные детали. Есть чистые и состаренные текстуры - отлично для квартир, ремонта, съёмного жилья и Rags to Riches.</p><span class="chip">Build/Buy · Grunge</span><p><a href="https://www.curseforge.com/sims4/build-buy/cheap-chipped" target="_blank" rel="noopener">Страница коллекции ↗</a></p><button class="btn alt" onclick="saveCCSet('Cheap & Chipped — Syboulette','Syboulette','37 предметов · Base Game · Build/Buy','Потёртая винтажная мебель и строительные детали.','https://www.curseforge.com/sims4/build-buy/cheap-chipped')">♡ Сохранить набор</button></div></article><article class="card"><div class="body"><h3>Naturalis Laundry — SIMcredible!</h3><div class="meta">Laundry room · 4 части коллекции</div><p>Серия для прачечной: функциональные стиральная машина, сушилка, верёвка и корзина требуют Laundry Day. Extras и Decor дополняют помещение; ironing station декоративная.</p><span class="chip">Build/Buy · Laundry</span><p><a href="https://www.thesimsresource.com/downloads/1741327/" target="_blank" rel="noopener">Washer Area ↗</a> · <a href="https://www.thesimsresource.com/downloads/1741336/" target="_blank" rel="noopener">Extras ↗</a> · <a href="https://www.thesimsresource.com/downloads/1741356/" target="_blank" rel="noopener">Decor ↗</a> · <a href="https://www.thesimsresource.com/downloads/1741347/" target="_blank" rel="noopener">Ironing Station ↗</a></p><button class="btn alt" onclick="saveCCSet('Naturalis Laundry — SIMcredible!','SIMcredible!','Laundry room · 4 части коллекции','Прачечная коллекция. Functional items требуют Laundry Day; ironing station декоративная.','https://www.thesimsresource.com/downloads/1741327/')">♡ Сохранить набор</button></div></article></div></section><section class="section"><h2>CC Download Checklist</h2><p class="meta">Отмечай пункты прямо во время скачивания. Прогресс сохраняется в браузере на этом устройстве.</p><div class="card" id="cccheck"><div class="meta" id="ccprogress">0 / 6 отмечено</div><div style="display:grid;gap:10px;margin:12px 0"><label><input type="checkbox" data-cccheck="source"> Открыла страницу оригинального автора или публикации</label><label><input type="checkbox" data-cccheck="description"> Прочитала описание и инструкции</label><label><input type="checkbox" data-cccheck="mesh"> Проверила, нужен ли mesh или отдельный файл</label><label><input type="checkbox" data-cccheck="packs"> Проверила требования к DLC / packs</label><label><input type="checkbox" data-cccheck="replacement"> Проверила, не является ли файл default replacement и не дублирует установленный</label><label><input type="checkbox" data-cccheck="file"> Распаковала архив и убедилась, что файл нужного типа</label></div><button class="btn alt" onclick="resetCCChecklist()">Сбросить checklist</button></div></section><section class="section"><h2>Как отбираем CC для каталога</h2><div class="grid"><div class="card"><h3>Тип файла</h3><p>Package, mesh, recolor, accessory или default replacement - отмечаем тип и отдельно проверяем, нужен ли mesh другого автора.</p></div><div class="card"><h3>CAS категория</h3><p>Возраст, пол, frame, категории одежды и фильтры CAS. Указываем ограничения, если они заявлены создателем.</p></div><div class="card"><h3>Default / Non-default</h3><p>Default replacement выделяем особо: два замещающих файла одного ресурса могут конфликтовать. Non-default обычно можно выбирать в CAS независимо.</p></div><div class="card"><h3>Источник и дата</h3><p>В карточке CC указываем исходную страницу автора, а не зеркальный перезалив; статус актуальности ставим только после проверки.</p></div></div></section><section class="section"><h2>Каталоги по категориям</h2><div class="grid"><div class="card"><h3>Скины</h3><p>Отдельные каталоги skin tones</p><a href="https://www.thesimsresource.com/downloads/browse/category/sims4-skintones/" target="_blank" rel="noopener">TSR ↗</a><br><a href="https://sims4mods.com/page/appear/skinton" target="_blank" rel="noopener">Sims4Mods ↗</a><br><a href="https://thesimscatalog.com/sims4/category/skintones/" target="_blank" rel="noopener">The Sims Catalog ↗</a></div><div class="card"><h3>Волосы</h3><p>Подборки и страницы загрузок</p><a href="https://ccthesims.com/category/the-sims-4/hairstyles/" target="_blank" rel="noopener">CC The Sims — Hairstyles ↗</a><br><a href="https://www.playground.ru/sims_4/file/hair_and_faces" target="_blank" rel="noopener">Playground — Hair & Faces ↗</a></div><div class="card"><h3>Одежда</h3><p>Каталоги пользовательской одежды</p><a href="https://sims-market.ru/cat/sims-4/odezhda/?page=2" target="_blank" rel="noopener">Sims-Market ↗</a><br><a href="https://good-mods.com/sims-4/odezhda/" target="_blank" rel="noopener">Good-Mods ↗</a><br><a href="https://sims4package.com/odezhda/" target="_blank" rel="noopener">Sims4Package ↗</a></div><div class="card"><h3>Главный каталог</h3><p>Общий поиск пользовательского контента</p><a href="https://ccthesims.com/" target="_blank" rel="noopener">CC The Sims ↗</a></div><div class="card"><h3>Обувь</h3><p>Отдельные каталоги обуви и обувных коллекций</p><a href="https://www.patreon.com/jiussims" target="_blank" rel="noopener">Jius ↗</a><br><a href="https://www.patreon.com/cw/madlen/home" target="_blank" rel="noopener">Madlen ↗</a><br><a href="https://dallasgirl79.tumblr.com/dg-shoes" target="_blank" rel="noopener">DallasGirl ↗</a></div><div class="card"><h3>Build & Buy / интерьер</h3><p>Мебель, декор, объекты, наборы комнат и функциональный CC</p><a href="https://www.thesimsresource.com/" target="_blank" rel="noopener">TSR ↗</a><br><a href="https://ccthesims.com/" target="_blank" rel="noopener">CC The Sims ↗</a><br><a href="https://thesimscatalog.com/sims4/" target="_blank" rel="noopener">The Sims Catalog ↗</a></div><div class="card"><h3>Макияж и аксессуары</h3><p>Поиск косметики, украшений, деталей лица и декоративных дополнений.</p><a href="https://www.thesimsresource.com/" target="_blank" rel="noopener">TSR — общий каталог ↗</a><br><a href="https://thesimscatalog.com/sims4/" target="_blank" rel="noopener">The Sims Catalog ↗</a></div><div class="card"><h3>Build / Buy и интерьер</h3><p>Мебель, декор, свет, функциональные предметы и наборы для оформления комнат.</p><a href="https://www.thesimsresource.com/" target="_blank" rel="noopener">TSR ↗</a><br><a href="https://ccthesims.com/" target="_blank" rel="noopener">CC The Sims ↗</a></div><div class="card"><h3>CC по типу контента</h3><p>Подборка для поиска по внешнему виду, а не только имени создателя: лица, волосы, одежда, обувь, интерьер.</p><a href="https://www.playground.ru/sims_4/file/hair_and_faces" target="_blank" rel="noopener">Playground — Hair & Faces ↗</a></div></div></section><section class="section"><h2>Исходные каталоги</h2><div class="grid"><div class="card"><b>The Sims Resource</b><p>Каталог CC</p><a href="https://www.thesimsresource.com/" target="_blank">Открыть ↗</a></div><div class="card"><b>CC The Sims</b><p>Подборки и авторы</p><a href="https://ccthesims.com/" target="_blank">Открыть ↗</a></div><div class="card"><b>The Sims Catalog</b><p>CC категории</p><a href="https://thesimscatalog.com/sims4/" target="_blank">Открыть ↗</a></div></div></section>`,translations:()=>`<div class="pagehead"><h1>Русификаторы и переводы</h1><p>Рабочее пространство переводчика: импорт таблиц, редактор строк, контроль игровых токенов и экспорт.</p></div><div class="grid"><div class="card"><h3>Переводчик модов</h3><p>Импортируй CSV, TSV или TXT. Оригинал сохраняется отдельно от перевода. Валидация подсвечивает возможную потерю плейсхолдеров и HTML-тегов.</p><a href="https://xn--e1agacrzcbcc.xn-p1ai/ru/translator" target="_blank" rel="noopener">Внешний переводчик package ↗</a></div><div class="card"><h3>STBL — следующий этап</h3><p>Этот редактор пока работает с текстовыми таблицами. Извлечение и запись STBL непосредственно внутри .package будет добавлено отдельным модулем.</p></div><div class="card"><h3>Правила работы</h3><p>Sim-имена, ключи, токены и структура оригинала должны оставаться сохранными. После обновления мода строки требуют повторной проверки.</p></div></div><section class="card" style="margin-top:16px"><h2>↔ Mod Translator — рабочее пространство</h2><div class="toolbar"><input id="translatorImportFiles" type="file" accept=".csv,.tsv,.txt" multiple onchange="translatorImportFiles(this.files)"><button class="btn alt" onclick="translatorLoadSample()">Пример</button><button class="btn alt" onclick="translatorAddRow()">+ Строка</button><button class="btn alt" onclick="translatorSave()">Сохранить</button><button class="btn alt" onclick="translatorLoadDraft()">Загрузить черновик</button><button class="btn alt" onclick="translatorExport()">Экспорт TSV</button><button class="btn alt" onclick="translatorExportUntranslated()">Только непереведённые</button><button class="btn alt" onclick="translatorExportJSON()">Backup JSON</button><button class="btn alt" onclick="translatorImportJSON()">Загрузить JSON</button><button class="btn alt" onclick="translatorBulkStatus('review')">Все → проверено</button><button class="btn alt" onclick="translatorBulkStatus('ingame')">Все → в игре</button><button class="btn alt" onclick="translatorClear()">Очистить</button></div><div class="toolbar"><input id="translatorModName" placeholder="Название мода" oninput="translatorUpdateMeta()"><input id="translatorLanguage" value="Russian (Русский)" placeholder="Язык" oninput="translatorUpdateMeta()"><select id="translatorFilter" onchange="translatorDraw()"><option value="all">Все строки</option><option value="untranslated">Непереведённые</option><option value="translated">Переведённые</option><option value="invalid">Ошибки токенов</option><option value="review">Требуют проверки</option><option value="duplicate">Дубли ключей</option></select><input id="translatorSearch" placeholder="Поиск по строкам" oninput="translatorDraw()"></div><div id="translatorMeta" class="meta">0 строк</div><div id="translatorRows"></div><div class="notice">Валидация проверяет сохранность плейсхолдеров, форматных токенов и HTML-тегов. Пока она не заменяет тестирование перевода в самой игре.<section class="card" style="margin-top:16px"><h2>STBL Engine v1 — raw String Table</h2><p>Поддержка чтения, создания, сравнения и экспорта uncompressed STBL v5. Обработка package/RefPack compression пока не включена.</p><div class="toolbar"><label class="btn alt">Original STBL<input type="file" accept=".stbl,.bin" onchange="stblLoadFile(this.files[0],'original')" style="display:block"></label><label class="btn alt">Translation STBL<input type="file" accept=".stbl,.bin" onchange="stblLoadFile(this.files[0],'translation')" style="display:block"></label><button class="btn alt" onclick="stblCompare()">Сравнить таблицы</button><button class="btn alt" onclick="stblExportCurrent()">Экспорт текущей</button><button class="btn alt" onclick="stblBulkToTranslator()">Original → Translator</button><button class="btn alt" onclick="stblExportFromTranslator()">Создать STBL из Translator</button></div><div id="stblMeta" class="meta">STBL-файлы не загружены</div><div id="stblDiff"></div><div class="toolbar" style="margin-top:10px"><button class="btn alt" onclick="stblRunSelfTests()">Запустить STBL self-tests</button></div><div id="stblTests"></div></section><section class="card" style="margin-top:14px"><h2>Package Engine v1 — DBPF Reader</h2><p>Read-only parser for DBPF 2.x package header/index, resource listing, TGI filtering and STBL identification. Extracts uncompressed and zlib resources; RefPack/internal compression remains unsupported.</p><div class="toolbar"><label class="btn alt">Load .package<input type="file" accept=".package,.world,.dbc" onchange="dbpfLoadPackage(this.files[0])" style="display:block"></label><input id="dbpfSearch" placeholder="Search type, group, instance" oninput="dbpfRender()"><label class="meta"><input id="dbpfOnlySTBL" type="checkbox" onchange="dbpfRender()"> STBL only</label><button class="btn alt" onclick="dbpfSelfTests()">Run Package self-tests</button><button class="btn alt" onclick="dbpfExportInventory()">Export resource inventory CSV</button></div><div id="dbpfMeta" class="meta">Package not loaded</div><div id="dbpfTests"></div><div id="dbpfResources"></div></section></section>`,guides:()=>`<div class="pagehead"><h1>Guides & Help</h1><p>Практические инструкции по безопасной установке и обслуживанию модов.</p></div><div class="grid"><div class="card"><h3>Правильная структура Mods</h3><p>CC package-файлы можно размещать в папках; script-моды обычно не глубже одного уровня от Mods. Не распаковывайте архивы внутрь игры без проверки инструкции автора.</p></div><div class="card"><h3>После обновления игры</h3><p>Перед запуском: резервная копия Saves, временно убрать Mods, проверить актуальность крупных модов и библиотек, вернуть моды группами и проверить игру.</p></div><div class="card"><h3>Как искать конфликт</h3><p>Отключить весь CC, проверить игру, затем возвращать половинами или по категориям. Не обновлять сразу десятки модов, если нужно найти источник ошибки.</p></div><div class="card"><h3>Overrides и Defaults</h3><p>Default replacements меняют базовый ресурс игры и обычно могут конфликтовать друг с другом. Проверяйте, не установлены ли два файла, заменяющих одну и ту же область.</p></div><div class="card"><h3>Core Libraries</h3><p>Некоторые моды требуют отдельную библиотеку или общий ресурс. Проверяйте требования на странице конкретного мода и не удаляйте библиотеку, пока не выясните, какие моды её используют.</p></div><div class="card"><h3>Сохранения и тестирование</h3><p>Для диагностики тестируйте на копии сохранения. Если мод добавляет игровые объекты, отношения или системные данные, удаление может повлиять на сохранение.</p></div><div class="grid"><div class="card"><h3>Установка модов</h3><p>Package, Script Mods, структура папок.</p></div><div class="card"><h3>Диагностика</h3><p>Дубликаты, зависимости, конфликты, тестирование группами.</p></div><div class="card"><h3>Realism сборка</h3><p>Связные игровые системы без конфликтов.</p></div><div class="card"><h3>CAS / CC</h3><p>Overrides, meshes, recolors, default/non-default.</p></div><div class="card"><h3>18+ раздел</h3><p>Отдельная возрастная зона и маркировка.</p></div></div>`<p>База знаний для установки, обновления и диагностики модов.</p></div><div class="grid"><div class="card"><h3>Установка модов</h3><p>Package, Script Mods, структура папок.</p></div><div class="card"><h3>После патча</h3><p>Проверка и безопасное обновление.</p></div><div class="card"><h3>Диагностика</h3><p>Дубликаты, зависимости, конфликты, тестирование группами.</p></div><div class="card"><h3>Realism сборка</h3><p>Связные игровые системы без конфликтов.</p></div><div class="card"><h3>CAS / CC</h3><p>Overrides, meshes, recolors, default/non-default.</p></div><div class="card"><h3>18+ раздел</h3><p>Отдельная возрастная зона и маркировка.</p></div></div>`};

];function getLibraryCollections(){try{return JSON.parse(localStorage.getItem(LIB_COLLECTION_KEY)||"null")||LIB_DEFAULTS.slice()}catch(e){return LIB_DEFAULTS.slice()}}function escLib(s){return String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;")}function createLibraryCollection(){let inp=document.getElementById("newcollection"),name=(inp?.value||"").trim();if(!name)return;if(getLibraryCollections().some(x=>x.toLowerCase()===name.toLowerCase())){alert("Такая коллекция уже есть");return}let arr=getLibraryCollections();arr.push(name);localStorage.setItem(LIB_COLLECTION_KEY,JSON.stringify(arr));if(inp)inp.value="";drawLibrary()}function assignLibraryCollection(key,value){let lib=getLibrary(),item=lib.find(x=>x.key===key);if(item){item.collection=value;localStorage.setItem(LIB_KEY,JSON.stringify(lib));drawLibrary()}}function drawLibrary(){let lib=getLibrary(),el=document.getElementById("librarycount"),grid=document.getElementById("librarygrid"),filter=document.getElementById("libfilter"),collections=getLibraryCollections(),active=filter?.value||"";if(filter){filter.innerHTML='<option value="">Все коллекции</option>'+collections.map(x=>'<option value="'+escLib(x)+'"'+(x===active?' selected':'')+'>'+escLib(x)+'</option>').join("")}let shown=active?lib.filter(x=>(x.collection||"")===active):lib;if(el)el.textContent="Сохранено: "+shown.length+" из "+lib.length+" · коллекций: "+collections.length;if(grid)grid.innerHTML=shown.map(x=>'<article class="card"><div class="body"><span class="chip">'+(x.type==="mod"?"MOD":x.type==="cc"?"CC":"CREATOR")+'</span><h3>'+escLib(x.title)+'</h3><div class="meta">'+escLib(x.creator)+(x.category?' · '+escLib(x.category):'')+'</div>'+(x.description?'<p>'+escLib(x.description)+'</p>':'')+'<p><a href="'+escLib(x.url)+'" target="_blank" rel="noopener">Открыть оригинальный источник ↗</a></p><label>Коллекция</label><select onchange="assignLibraryCollection(this.dataset.key,this.va ];function populateCCCategories(){let s=document.getElementById("cccategory");if(!s)return;let cats=[...new Set(ccSources.map(x=>x[0]))];s.innerHTML='<option value="">Все категории</option>'+cats.map(x=>'<option>'+x+'</option>').join("")}function drawCCSources(){let q=(document.getElementById("ccsearch")?.value||"").toLowerCase(),cat=document.getElementById("cccategory")?.value||"",list=ccSources.filter(x=>(!q||x.join(" ").toLowerCase().includes(q))&&(!cat||x[0]===cat)),count=document.getElementById("ccsourcecount"),grid=document.getElementById("ccsources");if(count)count.textContent="Найдено источников: "+list.length+" из "+ccSources.length+(cat?" · "+cat:"")+(q?" · поиск: "+q:"");if(grid)grid.innerHTML=list.map(x=>'<article class="card"><div class="body"><span class="chip">'+x[0]+'</span><h3>'+x[1]+'</h3><p><a href="'+x[2]+'" target="_blank" rel="noopener">Открыть источник ↗</a></p><button class="btn alt" onclick="saveCCSource(this.dataset.title,this.dataset.cat,this.dataset.url)" data-title="'+x[1]+'" data-cat="'+x[0]+'" data-url="'+x[2]+'">♡ В библиотеку</button></div></article>').join("")||"Ничего не найдено"}function clearCCSourceFilters(){let a=document.getElementById("ccsearch"),b=document.getElementById("cccategory");if(a)a.value="";if(b)b.value="";drawCCSources()}function saveCCSource(title,category,url){saveLibEntry({type:"cc",title,creator:"Источник / каталог",category,description:"Сохранён источник CC. Перейди по ссылке, чтобы выбрать и скачать конкретные файлы.",url})}function showCCFinder(type){const data={skin:{title:'Skin & Genetics',tip:'Ищи skin overlays, skin tones, presets, eyes, brows, freckles, moles и body details. Проверяй, default это replacement или отдельный CAS item.',links:[['The Sims Catalog — Skin tones','https://thesimscatalog.com/sims4/category/skintones/'],['TSR — Skin tones','https://www.thesimsresource.com/downloads/browse/category/sims4-skintones/'],['Sims4Mods — Skin tones','https://sims4mods.com/page/appear/skinton']]},hair:{title:'Hair',tip:'Проверяй возрастные категории, цветовые swatches, mesh requirements и наличие версии для разных frame.',links:[['CC The Sims — Hairstyles','https://ccthesims.com/category/the-sims-4/hairstyles/'],['Playground — Hair & Faces','https://www.playground.ru/sims_4/file/hair_and_faces']]},clothes:{title:'Clothing',tip:'Фильтруй по outfit category, frame, возрасту, mesh, swatches и пометке HQ. Не смешивай несовместимые body meshes.',links:[['Sims-Market — Clothing','https://sims-market.ru/cat/sims-4/odezhda/'],['Good-Mods — Clothing','https://good-mods.com/sims-4/odezhda/'],['Sims4Package — Clothing','https://sims4package.com/odezhda/']]},shoes:{title:'Shoes',tip:'У обуви отдельно смотри совместимость с foot slider/body presets, тип mesh, возраст и категории нарядов.',links:[['Jius','https://www.patreon.com/jiussims'],['Madlen','https://www.patreon.com/cw/madlen/home'],['DallasGirl79 — Shoes','https://dallasgirl79.tumblr.com/dg-shoes']]},bb:{title:'Build/Buy',tip:'Перед скачиванием проверяй mesh, набор/части набора, цену объекта, build/buy категорию, функциональность и наличие дополнительных модулей.',links:[['The Sims Resource','https://www.thesimsresource.com/'],['CC The Sims','https://ccthesims.com/'],['The Sims Catalog','https://thesimscatalog.com/sims4/']]},details:{title:'Makeup & Details',tip:'Разделяй makeup, face details, tattoos, jewelry, accessories и overlays. Проверяй CAS slot, чтобы избежать конфликтов между предметами одного слота.',links:[['TSR','https://www.thesimsresource.com/'],['The Sims Catalog','https://thesimscatalog.com/sims4/'],['CC The Sims','https://ccthesims.com/']]}};const d=data[type];if(!d)return;const el=document.getElementById('ccfinder');el.innerHTML='<h3>'+d.title+'</h3><p>'+d.tip+'</p>'+d.links.map(x=>'<a href="'+x[1]+'" target="_blank" rel="noopener">'+x[0]+' ↗</a>').join('<br>');}
function loadCCChecklist(){const box=document.querySelectorAll('[data-cccheck]');box.forEach(b=>{b.checked=localStorage.getItem('simsuniverse_cc_'+b.dataset.cccheck)==='1';b.onchange=()=>{localStorage.setItem('simsuniverse_cc_'+b.dataset.cccheck,b.checked?'1':'0');updateCCChecklist()}});updateCCChecklist()}function updateCCChecklist(){const box=document.querySelectorAll('[data-cccheck]');let n=0;box.forEach(b=>{if(b.checked)n++});const el=document.getElementById('ccprogress');if(el)el.textContent=n+' / '+box.length+' отмечено'+(n===box.length?' · готово к установке':'')}function resetCCChecklist(){document.querySelectorAll('[data-cccheck]').forEach(b=>{b.checked=false;localStorage.removeItem('simsuniverse_cc_'+b.dataset.cccheck)});updateCCChecklist()}function patchChecklist(){const boxes=document.querySelectorAll('#patchchecklist input[type="checkbox"]');let n=0;boxes.forEach(b=>{if(b.checked)n++});const el=document.getElementById('patchprogress');if(el)el.textContent=n+' / '+boxes.length+' steps completed';}function resetPatchChecklist(){document.querySelectorAll('#patchchecklist input[type="checkbox"]').forEach(b=>b.checked=false);patchChecklist();}

function populateModCategories(){const select=document.getElementById('mc');if(!select)return;const categories=[...new Set(mods.map(m=>m[2]))].sort((a,b)=>a.localeCompare(b));const uniqueCount=mods.filter((m,i)=>mods.findIndex(x=>x[0]===m[0]&&x[1]===m[1])===i).length;select.innerHTML='<option value="">Все категории ('+uniqueCount+' модов)</option>'+categories.map(c=>'<option>'+c+'</option>').join('');}
function clearModFilters(){let a=document.getElementById("ms"),b=document.getElementById("mc");if(a)a.value="";if(b)b.value="";drawMods()}function drawMods(){let q=(document.getElementById("ms")?.value||"").toLowerCase(),cat=document.getElementById("mc")?.value||"";let unique=mods.filter((m,i)=>mods.findIndex(x=>x[0]===m[0]&&x[1]===m[1])===i);let list=unique.filter(m=>(!q||m.join(" ").toLowerCase().includes(q))&&(!cat||m[2]===cat));let count=document.getElementById("modcount");if(count)count.textContent="Найдено: "+list.length+" из "+unique.length+" уникальных модов"+(cat?" · "+cat:"")+(q?" · поиск: "+q:"");document.getElementById("modsgrid").innerHTML=list.map(m=>`<article class="card mod"><div class="art">${m[3]}</div><div class="body"><h3>${m[0]}</h3><div class="meta">${m[1]} · ${m[2]}</div><p>${m[4]}</p><span class="chip">Требует проверки</span><br><a href="${m[5]}" target="_blank" rel="noopener">Оригинальный источник ↗</a><p><button class="btn alt" onclick="saveModByName(${JSON.stringify(m[0])},${JSON.stringify(m[1])})">♡ В библиотеку</button></p></div></article>`).join("")||"Ничего не найдено"}
function populateAuthorCategories(){const s=document.getElementById("ac");if(!s)return;const tags=[...new Set(authors.flatMap(a=>a[1].split("·").map(x=>x.trim()).filter(Boolean)))].sort((a,b)=>a.localeCompare(b));s.innerHTML='<option value="">Все направления ('+authors.length+' авторов)</option>'+tags.map(t=>'<option>'+t+'</option>').join("")}
function clearAuthorFilters(){const q=document.getElementById("as"),c=document.getElementById("ac");if(q)q.value="";if(c)c.value="";drawAuthors()}
function drawAuthors(){let q=(document.getElementById("as")?.value||"").toLowerCase(),cat=document.getElementById("ac")?.value||"";let list=authors.filter(a=>(!q||a.join(" ").toLowerCase().includes(q))&&(!cat||a[1].split("·").map(x=>x.trim()).includes(cat)));const count=document.getElementById("authorcount");if(count)count.textContent="Найдено: "+list.length+" из "+authors.length+" авторов"+(cat?" · "+cat:"")+(q?" · поиск: "+q:"");document.getElementById("authorsgrid").innerHTML=list.map(a=>`<article class="card"><div class="creator"><div class="avatar">${a[0][0]}</div><div><b>${a[0]}</b><div class="meta">${a[1]}</div></div></div><p><a href="${a[2]}" target="_blank" rel="noopener">Страница автора ↗</a></p><button class="btn alt" onclick="saveCreatorByName(${JSON.stringify(a[0])})">♡ В библиотеку</button></article>`).join("")||"Нет совпадений"}

let managerFiles=[],managerDisabled=new Set(),translatorRows=[];

function translatorLoadSample(){translatorRows=[{key:"0x000001",source:"You cannot do this right now. {0}",trans:"Сейчас вы не можете это сделать. {0}",status:"translated"},{key:"0x000002",source:"Ask about their career.",trans:"Спросить о карьере.",status:"ingame"},{key:"0x000003",source:"Enable custom content and mods.",trans:"",status:"draft"},{key:"0x000004",source:"<b>Welcome</b> %s",trans:"<b>Добро пожаловать</b> %s",status:"review"},{key:"0x000004",source:"Duplicate key demo {0}",trans:"Демонстрация дублирующего ключа {0}",status:"draft"}];translatorDraw()}
function translatorParseDelimited(text,delimiter){text=String(text||"").replace(/^\uFEFF/,"");let rows=[],row=[],field="",quoted=false;for(let i=0;i<text.length;i++){let ch=text[i];if(quoted){if(ch==='"'&&text[i+1]==='"'){field+='"';i++}else if(ch==='"')quoted=false;else field+=ch}else if(ch==='"')quoted=true;else if(ch===delimiter){row.push(field);field=""}else if(ch==="\n"||ch==="\r"){if(ch==="\r"&&text[i+1]==="\n")i++;row.push(field);if(row.some(v=>v.trim()))rows.push(row);row=[];field=""}else field+=ch}row.push(field);if(row.some(v=>v.trim()))rows.push(row);return rows}
async function translatorImportFiles(files){if(!files||!files.length)return;let incoming=[];for(const file of Array.from(files)){let text=await file.text(),ext=file.name.toLowerCase().split(".").pop();if(ext==="txt"){text.split(/\r?\n/).filter(line=>line.trim()).forEach(line=>incoming.push({key:"",source:line,trans:"",status:"draft"}));continue}let delimiter=ext==="csv"?",":"\t",rows=translatorParseDelimited(text,delimiter),header=rows[0]||[],hasHeader=header.some(v=>/source|original|english|translation|перевод|оригинал|key|identifier/i.test(v)),map={key:-1,source:0,trans:1,status:2};if(hasHeader){header.forEach((v,j)=>{let h=v.toLowerCase().trim();if(/^(key|id|identifier|ключ)$/i.test(h))map.key=j;else if(/^(source|original|english|en|text|original text|оригинал)$/i.test(h))map.source=j;else if(/^(russian|ru|translation|translated|перевод)$/i.test(h))map.trans=j;else if(/^(status|статус)$/i.test(h))map.status=j});rows.shift()}rows.forEach(row=>incoming.push({key:map.key>=0?row[map.key]||"":"",source:row[map.source]||"",trans:row[map.trans]||"",status:map.status>=0?row[map.status]||((row[map.trans]||"").trim()?"translated":"draft"):((row[map.trans]||"").trim()?"translated":"draft")}))}translatorRows.push(...incoming);translatorAutoSave();translatorDraw();document.getElementById("translatorImportFiles").value="";alert("Импортировано строк: "+incoming.length)}
function translatorExportRows(rows){let lines=[["Key","Source","Russian","Status"],...rows.map(r=>[r.key||"",r.source,r.trans,r.status||"draft"])],data=lines.map(r=>r.map(v=>String(v||"").replace(/\r?\n/g," ").replace(/\t/g," ")).join("\t")).join("\n"),blob=new Blob([data],{type:"text/tab-separated-values;charset=utf-8"}),url=URL.createObjectURL(blob),a=document.createElement("a");a.href=url;a.download=(document.getElementById("translatorModName")?.value||"mod-translation").replace(/[^a-z0-9-_]+/gi,"_")+".tsv";a.click();URL.revokeObjectURL(url)}
function translatorExport(){translatorExportRows(translatorRows)}
function translatorExportUntranslated(){translatorExportRows(translatorRows.filter(r=>!r.trans.trim()))}
function translatorExportJSON(){let draft={format:"SimsUniverseTranslatorBackup",version:1,mod:document.getElementById("translatorModName")?.value||"",language:document.getElementById("translatorLanguage")?.value||"Russian",exportedAt:new Date().toISOString(),rows:translatorRows};let blob=new Blob([JSON.stringify(draft,null,2)],{type:"application/json"}),url=URL.createObjectURL(blob),a=document.createElement("a");a.href=url;a.download=(draft.mod||"translator-backup").replace(/[^a-z0-9-_]+/gi,"_")+".json";a.click();URL.revokeObjectURL(url)}
function translatorImportJSON(){let input=document.createElement("input");input.type="file";input.accept=".json,application/json";input.onchange=async()=>{let file=input.files?.[0];if(!file)return;try{let data=JSON.parse(await file.text());if(!Array.isArray(data.rows))throw new Error("В backup отсутствует массив rows");if(!confirm("Заменить текущие "+translatorRows.length+" строк на "+data.rows.length+" из backup?"))return;translatorRows=data.rows.map(r=>({key:String(r.key||""),source:String(r.source||""),trans:String(r.trans||""),status:r.status||"draft"}));let mod=document.getElementById("translatorModName"),lang=document.getElementById("translatorLanguage");if(mod)mod.value=data.mod||"";if(lang)lang.value=data.language||"Russian";translatorAutoSave();translatorDraw();alert("JSON backup восстановлен")}catch(e){alert("Ошибка JSON: "+e.message)}};input.click()}
function translatorClear(){if(confirm("Очистить текущие строки?")){translatorRows=[];translatorDraw()}}
</script></body></html>
