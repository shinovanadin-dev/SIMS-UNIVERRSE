name: Mod Manager JavaScript Syntax Check
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Extract inline JavaScript
        run: |
          python - <<'PY'
          import re
          html = open("index.html", encoding="utf-8").read()
          scripts = re.findall(r"<script\\b[^>]*>([\\s\\S]*?)</script>", html, flags=re.I)
          if not scripts:
              raise SystemExit("No inline scripts found")
          open("/tmp/site-inline.js", "w", encoding="utf-8").write("\\n".join(scripts))
          print(f"Extracted {len(scripts)} inline script(s)")
          PY
      - name: Check JavaScript syntax
        run: node --check /tmp/site-inline.js
