name: Mod Manager JavaScript Syntax Check
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Extract inline JavaScript
        run: |
          python - <<'PY'
          import re
          html = open("index.html", encoding="utf-8").read()
          scripts = re.findall("<script[^>]*>(.*?)</script>", html, flags=re.I|re.S)
          if not scripts:
              raise SystemExit("No inline scripts found")
          js = chr(10).join(scripts)
          # Preserve JavaScript while adding line breaks inside HTML template text for actionable errors
          out, in_tpl, i = [], False, 0
          while i < len(js):
              ch = js[i]
              if ch == "`":
                  in_tpl = not in_tpl
              if in_tpl and ch == "<" and i+1 < len(js) and js[i+1] in "/!":
                  out.append(chr(10))
              out.append(ch)
              i += 1
          js = "".join(out)
          js = js.replace(",tools:()=>`", chr(10)+",tools:()=>`").replace(",guides:()=>`", chr(10)+",guides:()=>`")
          open("/tmp/site-inline.js", "w", encoding="utf-8").write(js)
          print(f"Extracted {len(scripts)} inline script(s)")
          PY
      - name: Check JavaScript syntax
        run: node --check /tmp/site-inline.js || { nl -ba /tmp/site-inline.js | sed -n '1638,1655p'; exit 1; }
