name: Mod Manager JavaScript Syntax Check
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Extract inline JavaScript
        run: |
          python - <<'PY'
          import re
          html = open("index.html", encoding="utf-8").read()
          scripts = re.findall("<script[^>]*>(.*?)</script>", html, flags=re.I|re.S)
          if not scripts:
              raise SystemExit("No inline scripts found")
          js = chr(10).join(scripts)
          open("/tmp/site-inline.js", "w", encoding="utf-8").write(js)
          print(f"Extracted {len(scripts)} inline script(s)")
          PY
      - name: Locate JavaScript syntax error
        run: npx --yes prettier@3.6.2 /tmp/site-inline.js --parser babel >/dev/null
      - name: Test DBPF parser fixture cases
        run: node tests/mod-manager-dbpf.test.js
      - name: Test backup verification and manifest status
        run: node tests/mod-manager-backup.test.js
